<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7ちゃんねる</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='8' fill='%23d97706'/%3E%3Crect x='8' y='8' width='48' height='48' rx='4' fill='%23f59e0b'/%3E%3Crect x='14' y='18' width='36' height='36' rx='2' fill='%23ffffff' transform='rotate(-4 32 36)'/%3E%3Cpath d='M20 28h24M20 35h24M20 42h16' stroke='%2394a3b8' stroke-width='3' stroke-linecap='round' transform='rotate(-4 32 36)'/%3E%3Ccircle cx='32' cy='14' r='4' fill='%23ef4444'/%3E%3Ccircle cx='31' cy='13' r='1.5' fill='%23fca5a5'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .post-content img, .post-content video { max-width: 100%; height: auto; }
    .threads-scroll { max-height: 480px; overflow-y: auto; scrollbar-width: thin; }
    .post-number { font-weight: 700; color: #991b1b; }
    .post-author { color: #15803d; font-weight: 600; }
    input[type="file"]::file-selector-button {
      background-color: #e5e7eb; border: 1px solid #d1d5db; border-radius: 0.375rem;
      padding: 0.25rem 0.75rem; font-size: 0.75rem; margin-right: 0.5rem; cursor: pointer;
    }
    input[type="file"]::file-selector-button:hover { background-color: #d1d5db; }
    .loading-spinner {
      display: inline-block; width: 1rem; height: 1rem;
      border: 2px solid #f3f3f3; border-top: 2px solid #991b1b;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .optimistic-item { opacity: 0.55; pointer-events: none; position: relative; }
    .optimistic-item::after {
      content: "送信中..."; position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%); font-size: 10px; color: #991b1b;
      background: #fef2f2; padding: 2px 6px; border-radius: 4px; border: 1px solid #fecaca;
    }
    .optimistic-post { opacity: 0.6; border-left: 3px solid #f59e0b !important; }
    #statusBanner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      text-align: center; padding: 6px; font-size: 12px;
      transition: transform 0.3s; transform: translateY(-100%);
    }
    #statusBanner.show { transform: translateY(0); }

    /* ツリー表示 */
    .post-tree { position: relative; }
    .post-tree > .post-children {
      margin-left: 16px; padding-left: 12px;
      border-left: 2px solid #fbbf24; margin-top: 8px;
    }
    .reply-badge {
      display: inline-block; background: #fef3c7; color: #92400e;
      font-size: 11px; font-weight: 700; padding: 1px 6px;
      border-radius: 4px; border: 1px solid #fcd34d;
      margin-right: 4px; cursor: pointer; text-decoration: none;
    }
    .reply-badge:hover { background: #fde68a; }

    .post-card { position: relative; transition: background 0.15s; }
    .post-card:hover { background: #fffdf5; }
    .post-card .reply-btn { opacity: 0; transition: opacity 0.15s; }
    .post-card:hover .reply-btn { opacity: 1; }
    @media (hover: none) { .post-card .reply-btn { opacity: 1; } }
    .post-card.reply-target { background: #eff6ff !important; box-shadow: 0 0 0 2px #3b82f6 inset; }
    .highlight-flash { animation: flashHighlight 1.5s ease-out; }
    @keyframes flashHighlight { 0% { background: #fef08a; } 100% { background: transparent; } }
    #replyModeBar { display: none; }
    #replyModeBar.active { display: flex; }

    /* ============================================================
       ファイルプレビュー & 進捗
    ============================================================ */
    .file-preview-item {
      display: flex; align-items: center; gap: 8px;
      background: white; border: 1px solid #e5e7eb;
      border-radius: 6px; padding: 6px 8px; font-size: 12px;
      margin-top: 4px;
    }
    .file-preview-thumb {
      width: 40px; height: 40px; object-fit: cover;
      border-radius: 4px; border: 1px solid #e5e7eb; flex-shrink: 0;
    }
    .file-preview-icon {
      width: 40px; height: 40px; display: flex;
      align-items: center; justify-content: center;
      background: #f3f4f6; border-radius: 4px;
      font-size: 20px; flex-shrink: 0;
    }
    .file-preview-info { flex: 1; min-width: 0; }
    .file-preview-name {
      font-weight: 600; color: #374151;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; font-size: 11px;
    }
    .file-preview-size { color: #9ca3af; font-size: 10px; }
    .file-preview-remove {
      background: #fee2e2; color: #991b1b; border: none;
      border-radius: 4px; width: 20px; height: 20px;
      cursor: pointer; font-weight: bold; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
    }
    .file-preview-remove:hover { background: #fecaca; }

    .progress-bar-container {
      width: 100%; height: 4px; background: #e5e7eb;
      border-radius: 2px; overflow: hidden; margin-top: 4px;
    }
    .progress-bar-fill {
      height: 100%; background: linear-gradient(90deg, #dc2626, #f59e0b);
      transition: width 0.2s;
    }

    /* レス内の添付ファイル */
    .attachment-box {
      margin-top: 8px; padding: 8px;
      border: 1px solid #e5e7eb; background: #f9fafb;
      border-radius: 6px;
    }
    .attachment-box img { max-height: 256px; border-radius: 4px; }
    .attachment-box video { max-height: 256px; max-width: 100%; border-radius: 4px; }
    .attachment-box audio { width: 100%; max-width: 400px; margin: 4px 0; }
    .attachment-download {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; color: #2563eb; text-decoration: underline;
      margin-top: 4px; word-break: break-all;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 max-w-4xl mx-auto">

  <div id="statusBanner" class="bg-red-600 text-white"></div>

  <header class="border-b-2 border-red-800 pb-2 mb-4 flex justify-between items-center flex-wrap gap-2">
    <div>
      <h1 id="siteTitle" class="text-3xl font-bold text-red-900 cursor-pointer">7ちゃんねる</h1>
      <p class="text-sm text-gray-600">
        <span id="connDot" class="inline-block w-2 h-2 rounded-full bg-gray-400"></span>
        <span id="connText">接続中...</span>
      </p>
    </div>
    <button id="backToListBtn" class="hidden bg-gray-600 hover:bg-gray-700 text-white text-xs py-1.5 px-3 rounded transition shadow">
      ← スレッド一覧に戻る
    </button>
  </header>

  <!-- View 1: スレッド一覧 -->
  <div id="threadListView">
    <section class="bg-amber-50 border border-amber-200 p-4 rounded mb-6 shadow-sm">
      <h2 class="text-lg font-bold text-gray-700 mb-2">新規スレッド作成</h2>
      <form id="createThreadForm" class="space-y-3">
        <input type="text" id="threadTitle" placeholder="スレッドのタイトルを入力（必須）" maxlength="100" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-red-300 focus:border-red-400 outline-none" required>
        <textarea id="firstPostContent" rows="3" placeholder="最初の書き込み内容（任意）" maxlength="2000" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-red-300 focus:border-red-400 outline-none"></textarea>
        <button type="submit" id="createThreadBtn" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-6 rounded text-sm transition shadow-sm">
          スレッドを立てる
        </button>
      </form>
    </section>

    <main>
      <h2 class="text-xl font-bold border-b pb-1 mb-4 text-gray-700">スレッド一覧</h2>
      <div id="threadsContainer" class="space-y-2 threads-scroll pr-1">
        <p class="text-gray-500 text-sm"><span class="loading-spinner"></span> スレッドを読み込み中...</p>
      </div>
    </main>
  </div>

  <!-- View 2: スレッド詳細 -->
  <div id="threadDetailView" class="hidden">
    <div class="bg-white p-4 border border-gray-300 rounded mb-4 shadow-sm">
      <h2 id="currentThreadTitle" class="text-2xl font-bold text-red-900 mb-1 break-words"></h2>
      <p id="currentThreadDate" class="text-xs text-gray-500"></p>
    </div>

    <section class="bg-amber-50 border border-amber-200 p-4 rounded mb-6 shadow-sm">
      <h3 class="text-md font-bold text-gray-700 mb-2">このスレッドに書き込む</h3>

      <div id="replyModeBar" class="bg-blue-100 border border-blue-300 rounded p-2 mb-3 text-xs text-blue-800 items-center justify-between gap-2">
        <span>💬 <strong id="replyTargetLabel"></strong> への返信中</span>
        <button type="button" id="cancelReplyBtn" class="bg-blue-200 hover:bg-blue-300 text-blue-900 px-2 py-1 rounded font-bold">キャンセル</button>
      </div>

      <form id="postForm" class="space-y-3">
        <textarea id="postContent" rows="4" placeholder="コメントを入力してください。URLは自動でリンク化されます。" maxlength="2000" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-red-300 focus:border-red-400 outline-none" required></textarea>

        <div>
          <label class="block text-xs text-gray-600 mb-1">
            添付ファイル（最大3つ、各10MB / 画像・動画・音声・PDF・テキスト）
          </label>
          <input type="file" id="fileInput" multiple
            accept="image/*,video/*,audio/*,application/pdf,text/plain"
            class="text-xs text-gray-600 w-full file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-gray-200 file:text-gray-700 hover:file:bg-gray-300">
        </div>

        <!-- 選択済みファイル一覧 -->
        <div id="filePreviewList" class="space-y-2"></div>

        <div class="flex items-center justify-between flex-wrap gap-3">
          <p class="text-[10px] text-gray-400">※ 大きいファイルは時間がかかります</p>
          <div class="flex gap-2">
            <button type="button" id="cancelUploadBtn" class="hidden bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded text-sm transition">
              キャンセル
            </button>
            <button type="submit" id="submitBtn" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-6 rounded text-sm transition shadow-sm whitespace-nowrap">
              書き込む
            </button>
          </div>
        </div>
      </form>
    </section>

    <main>
      <h3 class="text-lg font-bold border-b pb-1 mb-4 text-gray-700">レス一覧</h3>
      <div id="postsContainer" class="space-y-4">
        <p class="text-gray-500 text-sm"><span class="loading-spinner"></span> 読み込み中...</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import {
      getDatabase, ref, push, set, update, onValue,
      query, orderByChild
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import {
      getStorage,
      ref as storageRef,
      uploadBytesResumable,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // ============================================================
    // Firebase 設定
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBCoiJAnVWIOH9csEPlDyWJgfj6sSlNO2o",
      authDomain: "chaneler-52b95.firebaseapp.com",
      projectId: "chaneler-52b95",
      databaseURL: "https://chaneler-52b95-default-rtdb.firebaseio.com",
      storageBucket: "chaneler-52b95.firebasestorage.app",
      messagingSenderId: "538510918184",
      appId: "1:538510918184:web:58232aa80922ff00b92b1d",
      measurementId: "G-QF3LDMNQYQ"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);
    const storage = getStorage(app);

    // ============================================================
    // 定数
    // ============================================================
    const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB
    const MAX_FILES = 3;
    const ALLOWED_PREFIXES = [
      'image/', 'video/', 'audio/',
      'application/pdf', 'text/plain'
    ];

    // ============================================================
    // 接続状態 & バナー
    // ============================================================
    const connDot = document.getElementById('connDot');
    const connText = document.getElementById('connText');
    const statusBanner = document.getElementById('statusBanner');
    let bannerTimer = null;

    function setConnection(online) {
      if (online) {
        connDot.className = 'inline-block w-2 h-2 rounded-full bg-green-500';
        connText.textContent = 'オンライン（リアルタイム同期中）';
      } else {
        connDot.className = 'inline-block w-2 h-2 rounded-full bg-red-500';
        connText.textContent = 'オフライン';
      }
    }

    function showBanner(msg, isError = true) {
      statusBanner.textContent = msg;
      statusBanner.className = (isError ? 'bg-red-600' : 'bg-green-600') + ' text-white show';
      statusBanner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;text-align:center;padding:6px;font-size:12px;transform:translateY(0);';
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => {
        statusBanner.style.transform = 'translateY(-100%)';
      }, 4000);
    }

    window.addEventListener('online', () => setConnection(true));
    window.addEventListener('offline', () => setConnection(false));
    setConnection(navigator.onLine);

    // ============================================================
    // グローバル
    // ============================================================
    let currentThreadKey = null;
    let postsUnsubscribe = null;
    let threadsUnsubscribe = null;
    let replyTargetId = null;
    let replyTargetNumber = null;
    let latestPosts = [];

    // ファイル管理
    let selectedFiles = [];
    let currentUploadTasks = [];
    let isUploading = false;

    const threadListView = document.getElementById('threadListView');
    const threadDetailView = document.getElementById('threadDetailView');
    const backToListBtn = document.getElementById('backToListBtn');
    const siteTitle = document.getElementById('siteTitle');
    const threadsContainer = document.getElementById('threadsContainer');
    const postsContainer = document.getElementById('postsContainer');
    const replyModeBar = document.getElementById('replyModeBar');
    const replyTargetLabel = document.getElementById('replyTargetLabel');
    const cancelReplyBtn = document.getElementById('cancelReplyBtn');
    const fileInput = document.getElementById('fileInput');
    const filePreviewList = document.getElementById('filePreviewList');
    const cancelUploadBtn = document.getElementById('cancelUploadBtn');

    // ============================================================
    // 画面切り替え
    // ============================================================
    function showThreadList() {
      threadListView.classList.remove('hidden');
      threadDetailView.classList.add('hidden');
      backToListBtn.classList.add('hidden');
      currentThreadKey = null;
      cancelReply();
      clearSelectedFiles();
      if (postsUnsubscribe) { postsUnsubscribe(); postsUnsubscribe = null; }
      postsContainer.innerHTML = '<p class="text-gray-500 text-sm">読み込み中...</p>';
    }

    function openThread(threadKey, title, createdAt) {
      currentThreadKey = threadKey;
      document.getElementById('currentThreadTitle').innerText = title;
      document.getElementById('currentThreadDate').innerText = '作成日時: ' + createdAt;
      threadListView.classList.add('hidden');
      threadDetailView.classList.remove('hidden');
      backToListBtn.classList.remove('hidden');
      cancelReply();
      clearSelectedFiles();
      loadPosts(threadKey);
    }

    // ============================================================
    // 返信モード
    // ============================================================
    function startReply(postKey, postNumber) {
      replyTargetId = postKey;
      replyTargetNumber = postNumber;
      replyTargetLabel.textContent = '>>' + postNumber;
      replyModeBar.classList.add('active');
      document.querySelectorAll('.post-card').forEach(el => el.classList.remove('reply-target'));
      const target = document.querySelector(`[data-post-key="${postKey}"]`);
      if (target) target.classList.add('reply-target');
      const ta = document.getElementById('postContent');
      ta.focus();
      ta.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function cancelReply() {
      replyTargetId = null;
      replyTargetNumber = null;
      replyModeBar.classList.remove('active');
      document.querySelectorAll('.post-card').forEach(el => el.classList.remove('reply-target'));
    }

    function jumpToPost(postKey) {
      const el = document.querySelector(`[data-post-key="${postKey}"]`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('highlight-flash');
        setTimeout(() => el.classList.remove('highlight-flash'), 1500);
      }
    }

    // ============================================================
    // イベント委譲（返信ボタン・バッジ）
    // ============================================================
    postsContainer.addEventListener('click', (e) => {
      const replyBtn = e.target.closest('[data-action="reply"]');
      if (replyBtn) {
        e.preventDefault();
        e.stopPropagation();
        startReply(
          replyBtn.getAttribute('data-post-key'),
          parseInt(replyBtn.getAttribute('data-post-number'), 10)
        );
        return;
      }
      const badge = e.target.closest('[data-action="jump"]');
      if (badge) {
        e.preventDefault();
        e.stopPropagation();
        jumpToPost(badge.getAttribute('data-post-key'));
      }
    });

    backToListBtn.addEventListener('click', showThreadList);
    siteTitle.addEventListener('click', showThreadList);
    cancelReplyBtn.addEventListener('click', cancelReply);

    // ============================================================
    // ユーティリティ
    // ============================================================
    function formatContent(str) {
      if (!str) return '';
      const escaped = escapeHtml(str);
      const urlRegex = /(https?:\/\/[^\s<]+)/g;
      return escaped.replace(urlRegex, (url) =>
        `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline break-all">${url}</a>`);
    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    }
    function isAllowedType(file) {
      return ALLOWED_PREFIXES.some(p => file.type.startsWith(p));
    }
    function sanitizeFileName(name) {
      const lastDot = name.lastIndexOf('.');
      const base = lastDot > 0 ? name.substring(0, lastDot) : name;
      const ext = lastDot > 0 ? name.substring(lastDot) : '';
      const safeBase = base.replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 50) || 'file';
      const safeExt = ext.replace(/[^a-zA-Z0-9.]/g, '').slice(0, 10);
      return safeBase + safeExt;
    }

    // ============================================================
    // ファイル選択 UI
    // ============================================================
    fileInput.addEventListener('change', () => {
      const files = Array.from(fileInput.files);
      const remaining = MAX_FILES - selectedFiles.length;
      const toAdd = files.slice(0, remaining);

      if (files.length > remaining) {
        showBanner(`最大 ${MAX_FILES} ファイルまでです。${remaining} 個だけ追加しました。`, true);
      }

      for (const file of toAdd) {
        if (file.size > MAX_FILE_SIZE) {
          showBanner(`「${file.name}」はサイズが大きすぎます（最大 10MB）`, true);
          continue;
        }
        if (!isAllowedType(file)) {
          showBanner(`「${file.name}」は対応していない形式です`, true);
          continue;
        }
        if (selectedFiles.some(s => s.file.name === file.name && s.file.size === file.size)) {
          continue;
        }
        const id = 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        let previewUrl = null;
        if (file.type.startsWith('image/')) {
          previewUrl = URL.createObjectURL(file);
        }
        selectedFiles.push({ id, file, previewUrl });
      }

      fileInput.value = '';
      renderFilePreview();
    });

    function renderFilePreview() {
      filePreviewList.innerHTML = '';
      if (selectedFiles.length === 0) return;

      selectedFiles.forEach(item => {
        const el = document.createElement('div');
        el.className = 'file-preview-item';
        el.dataset.fileId = item.id;

        let thumbHtml;
        if (item.previewUrl) {
          thumbHtml = `<img src="${item.previewUrl}" class="file-preview-thumb" alt="preview">`;
        } else if (item.file.type.startsWith('video/')) {
          thumbHtml = `<div class="file-preview-icon">🎬</div>`;
        } else if (item.file.type.startsWith('audio/')) {
          thumbHtml = `<div class="file-preview-icon">🎵</div>`;
        } else if (item.file.type === 'application/pdf') {
          thumbHtml = `<div class="file-preview-icon">📄</div>`;
        } else if (item.file.type.startsWith('text/')) {
          thumbHtml = `<div class="file-preview-icon">📝</div>`;
        } else {
          thumbHtml = `<div class="file-preview-icon">📎</div>`;
        }

        el.innerHTML = `
          ${thumbHtml}
          <div class="file-preview-info">
            <div class="file-preview-name" title="${escapeHtml(item.file.name)}">${escapeHtml(item.file.name)}</div>
            <div class="file-preview-size">${formatSize(item.file.size)}</div>
          </div>
          <button type="button" class="file-preview-remove" data-file-id="${item.id}" title="削除">✕</button>
        `;
        filePreviewList.appendChild(el);
      });

      filePreviewList.querySelectorAll('.file-preview-remove').forEach(btn => {
        btn.addEventListener('click', (e) => {
          removeSelectedFile(e.currentTarget.dataset.fileId);
        });
      });
    }

    function removeSelectedFile(fileId) {
      const idx = selectedFiles.findIndex(s => s.id === fileId);
      if (idx >= 0) {
        if (selectedFiles[idx].previewUrl) URL.revokeObjectURL(selectedFiles[idx].previewUrl);
        selectedFiles.splice(idx, 1);
      }
      renderFilePreview();
    }

    function clearSelectedFiles() {
      selectedFiles.forEach(s => { if (s.previewUrl) URL.revokeObjectURL(s.previewUrl); });
      selectedFiles = [];
      renderFilePreview();
      fileInput.value = '';
    }

    // ============================================================
    // アップロード（進捗 + リトライ）
    // ============================================================
    function uploadFileWithProgress(file, onProgress, maxRetries = 3) {
      return new Promise((resolve, reject) => {
        let attempt = 0;
        const safeName = sanitizeFileName(file.name);
        const storagePath = `uploads/${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${safeName}`;
        const sRef = storageRef(storage, storagePath);

        const tryUpload = () => {
          attempt++;
          const uploadTask = uploadBytesResumable(sRef, file, {
            contentType: file.type || 'application/octet-stream',
            customMetadata: {
              originalName: file.name,
              uploadedAt: new Date().toISOString()
            }
          });

          const taskEntry = { uploadTask, storagePath };
          currentUploadTasks.push(taskEntry);

          uploadTask.on('state_changed',
            (snapshot) => {
              const pct = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
              onProgress(pct, snapshot);
            },
            (error) => {
              console.error(`アップロードエラー (試行 ${attempt}/${maxRetries}):`, error);
              const i = currentUploadTasks.indexOf(taskEntry);
              if (i >= 0) currentUploadTasks.splice(i, 1);
              if (attempt < maxRetries) {
                setTimeout(tryUpload, 1000 * attempt);
              } else {
                reject(error);
              }
            },
            async () => {
              const i = currentUploadTasks.indexOf(taskEntry);
              if (i >= 0) currentUploadTasks.splice(i, 1);
              try {
                const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                resolve({
                  url: downloadURL,
                  name: file.name,
                  type: file.type || 'application/octet-stream',
                  size: file.size,
                  storagePath
                });
              } catch (e) {
                reject(e);
              }
            }
          );
        };
        tryUpload();
      });
    }

    // キャンセル
    cancelUploadBtn.addEventListener('click', () => {
      if (currentUploadTasks.length === 0) return;
      if (!confirm('アップロードをキャンセルしますか？')) return;
      currentUploadTasks.forEach(t => {
        try { t.uploadTask.cancel(); } catch (e) {}
      });
      currentUploadTasks = [];
      isUploading = false;
      cancelUploadBtn.classList.add('hidden');
      const sb = document.getElementById('submitBtn');
      sb.disabled = false;
      sb.innerText = '書き込む';
      showBanner('アップロードをキャンセルしました', true);
    });

    // ============================================================
    // スレッド作成
    // ============================================================
    document.getElementById('createThreadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('threadTitle').value.trim();
      const content = document.getElementById('firstPostContent').value.trim();
      const btn = document.getElementById('createThreadBtn');
      if (!title) { alert('スレッドタイトルを入力してください。'); return; }

      btn.disabled = true;
      btn.innerText = '作成中...';

      const tempKey = 'temp_' + Date.now();
      const tempItem = document.createElement('div');
      tempItem.id = 'optimistic_thread_' + tempKey;
      tempItem.className = 'bg-white p-3 border border-gray-300 rounded flex justify-between items-center shadow-sm optimistic-item';
      tempItem.innerHTML = `
        <div class="flex-1 min-w-0">
          <span class="font-bold text-blue-900 break-words">${escapeHtml(title)}</span>
          <span class="text-xs text-gray-400 ml-2 whitespace-nowrap">(送信中...)</span>
        </div>`;
      threadsContainer.prepend(tempItem);
      document.getElementById('createThreadForm').reset();

      try {
        const newThreadRef = push(ref(db, 'threads'));
        const threadKey = newThreadRef.key;
        const writes = [set(newThreadRef, {
          title: title,
          createdAt: Date.now(),
          postCount: content ? 1 : 0
        })];
        if (content) {
          const postRef = push(ref(db, `threads/${threadKey}/posts`));
          writes.push(set(postRef, {
            author: '名無しさん',
            content: content,
            file: null,
            files: null,
            createdAt: Date.now(),
            parentId: null,
            replyTo: null
          }));
        }
        await Promise.all(writes);
        showBanner('スレッドを保存しました', false);
        const tempEl = document.getElementById('optimistic_thread_' + tempKey);
        if (tempEl) tempEl.remove();
      } catch (err) {
        console.error("スレッド作成エラー:", err);
        const el = document.getElementById('optimistic_thread_' + tempKey);
        if (el) el.remove();
        showBanner('保存失敗: ' + (err.code || err.message || ''), true);
      } finally {
        btn.disabled = false;
        btn.innerText = 'スレッドを立てる';
      }
    });

    // ============================================================
    // スレッド一覧
    // ============================================================
    function initThreadsListener() {
      if (threadsUnsubscribe) threadsUnsubscribe();
      const q = query(ref(db, 'threads'), orderByChild('createdAt'));

      threadsUnsubscribe = onValue(q, (snapshot) => {
        setConnection(true);
        threadsContainer.innerHTML = '';
        if (!snapshot.exists()) {
          threadsContainer.innerHTML = '<p class="text-gray-500 text-sm">スレッドがありません。新しく作成してください。</p>';
          return;
        }
        const threads = [];
        snapshot.forEach((child) => threads.push({ key: child.key, ...child.val() }));
        threads.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        threads.forEach((thread) => {
          let date = '日時不明';
          if (thread.createdAt) {
            try { date = new Date(thread.createdAt).toLocaleString('ja-JP'); } catch (e) {}
          }
          const item = document.createElement('div');
          item.className = 'bg-white p-3 border border-gray-300 rounded hover:bg-amber-50 cursor-pointer transition flex justify-between items-center shadow-sm';
          item.addEventListener('click', () => openThread(thread.key, thread.title, date));
          item.innerHTML = `
            <div class="flex-1 min-w-0">
              <span class="font-bold text-blue-900 break-words">${escapeHtml(thread.title)}</span>
              <span class="text-xs text-gray-400 ml-2 whitespace-nowrap">(${date})</span>
            </div>
            <span class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded-full ml-2 whitespace-nowrap">開く</span>`;
          threadsContainer.appendChild(item);
        });
      }, (error) => {
        console.error("スレッド一覧の取得エラー:", error);
        setConnection(false);
        threadsContainer.innerHTML = '<p class="text-red-500 text-sm">スレッド一覧の読み込みに失敗しました。<br>Realtime Database のルールを確認してください。</p>';
        showBanner('読み込み失敗: ' + (error.code || error.message), true);
      });
    }

    // ============================================================
    // レス読み込み（ツリー）
    // ============================================================
    function loadPosts(threadKey) {
      if (postsUnsubscribe) { postsUnsubscribe(); postsUnsubscribe = null; }
      postsContainer.innerHTML = '<p class="text-gray-500 text-sm"><span class="loading-spinner"></span> 読み込み中...</p>';

      const q = query(ref(db, `threads/${threadKey}/posts`), orderByChild('createdAt'));

      postsUnsubscribe = onValue(q, (snapshot) => {
        setConnection(true);
        postsContainer.innerHTML = '';

        if (!snapshot.exists()) {
          postsContainer.innerHTML = '<p class="text-gray-500 text-sm">まだ書き込みがありません。</p>';
          latestPosts = [];
          return;
        }

        const posts = [];
        snapshot.forEach((child) => posts.push({ key: child.key, ...child.val() }));
        posts.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

        const numberMap = new Map();
        posts.forEach((p, i) => numberMap.set(p.key, i + 1));

        posts.forEach(p => {
          p._number = numberMap.get(p.key);
          p._children = [];
        });

        const rootPosts = [];
        const keyToPost = new Map(posts.map(p => [p.key, p]));
        posts.forEach(p => {
          if (p.parentId && keyToPost.has(p.parentId)) {
            keyToPost.get(p.parentId)._children.push(p);
          } else {
            rootPosts.push(p);
          }
        });

        latestPosts = posts;
        rootPosts.forEach(p => postsContainer.appendChild(renderPost(p)));
      }, (error) => {
        console.error("レス読み込みエラー:", error);
        setConnection(false);
        postsContainer.innerHTML = '<p class="text-red-500 text-sm">レス一覧の読み込みに失敗しました。</p>';
        showBanner('レス読み込み失敗: ' + (error.code || error.message), true);
      });
    }

    // ============================================================
    // レス1件描画（画像・動画・音声・PDF・テキスト対応）
    // ============================================================
    function renderPost(post) {
      const wrapper = document.createElement('div');
      wrapper.className = 'post-tree';
      wrapper.dataset.postKey = post.key;

      let date = '日時不明';
      if (post.createdAt) {
        try { date = new Date(post.createdAt).toLocaleString('ja-JP'); } catch (e) {}
      }

      let replyBadge = '';
      if (post.parentId && post.replyTo) {
        replyBadge = `<a class="reply-badge" data-action="jump" data-post-key="${post.parentId}" href="javascript:void(0)">>>${post.replyTo}</a>`;
      }

      const card = document.createElement('div');
      card.className = 'post-card bg-white p-3 border border-gray-300 rounded text-sm shadow-sm';
      card.dataset.postKey = post.key;
      card.id = 'post_' + post.key;

      let html = `
        <div class="flex justify-between items-start gap-2 mb-1">
          <div class="font-bold text-gray-700 flex flex-wrap items-baseline gap-x-1 flex-1 min-w-0">
            <span class="post-number">${post._number}</span>
            <span>：</span>
            <span class="post-author">${escapeHtml(post.author || '名無しさん')}</span>
            <span>：</span>
            <span class="text-gray-500 text-xs font-normal">${date}</span>
          </div>
          <button type="button"
            class="reply-btn text-xs bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold px-2 py-0.5 rounded transition whitespace-nowrap"
            data-action="reply"
            data-post-key="${post.key}"
            data-post-number="${post._number}">
            ↩ 返信
          </button>
        </div>
        <div class="text-gray-900 whitespace-pre-wrap mb-1 break-words">${replyBadge}${formatContent(post.content)}</div>`;

      // ============================================================
      // 添付ファイル表示（単一 file / 複数 files 両対応）
      // ============================================================
      const attachments = [];
      if (post.files && Array.isArray(post.files)) {
        post.files.forEach(f => attachments.push(f));
      } else if (post.file && post.file.url) {
        attachments.push(post.file);
      }

      if (attachments.length > 0) {
        html += `<div class="space-y-2 mt-2">`;
        attachments.forEach((file) => {
          const ft = file.type || '';
          const fn = file.name || '添付ファイル';
          const fu = file.url;

          html += `<div class="attachment-box">`;

          if (ft.startsWith('image/')) {
            html += `<a href="${fu}" target="_blank" rel="noopener noreferrer">
              <img src="${fu}" alt="${escapeHtml(fn)}" loading="lazy">
            </a>`;
          } else if (ft.startsWith('video/')) {
            html += `<video controls preload="metadata">
              <source src="${fu}" type="${ft}">
              お使いのブラウザは video タグをサポートしていません。
            </video>`;
          } else if (ft.startsWith('audio/')) {
            html += `<div class="text-xs text-gray-600 mb-1">🎵 音声ファイル</div>
              <audio controls preload="metadata">
                <source src="${fu}" type="${ft}">
                お使いのブラウザは audio タグをサポートしていません。
              </audio>`;
          } else if (ft === 'application/pdf') {
            html += `<div class="text-xs text-gray-600 mb-1">📄 PDF ファイル</div>`;
          } else if (ft.startsWith('text/')) {
            html += `<div class="text-xs text-gray-600 mb-1">📝 テキストファイル</div>`;
          } else {
            html += `<div class="text-xs text-gray-600 mb-1">📎 ファイル</div>`;
          }

          html += `<a class="attachment-download" href="${fu}" target="_blank" rel="noopener noreferrer" download="${escapeHtml(fn)}">
            ⬇ ${escapeHtml(fn)}${file.size ? ' (' + formatSize(file.size) + ')' : ''}
          </a>`;
          html += `</div>`;
        });
        html += `</div>`;
      }

      card.innerHTML = html;
      wrapper.appendChild(card);

      if (post._children && post._children.length > 0) {
        post._children.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        const childrenContainer = document.createElement('div');
        childrenContainer.className = 'post-children';
        post._children.forEach(child => {
          childrenContainer.appendChild(renderPost(child));
        });
        wrapper.appendChild(childrenContainer);
      }

      return wrapper;
    }

    // ============================================================
    // レス投稿（複数ファイル + 進捗）
    // ============================================================
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentThreadKey) { alert('スレッドが選択されていません。'); return; }
      if (isUploading) { alert('アップロード中です。しばらくお待ちください。'); return; }

      const content = document.getElementById('postContent').value.trim();
      const submitBtn = document.getElementById('submitBtn');

      if (!content) { alert('コメントを入力してください。'); return; }

      const parentIdForPost = replyTargetId;
      const replyToNumber = replyTargetNumber;
      const filesToUpload = selectedFiles.map(s => s.file);

      isUploading = true;
      const originalText = submitBtn.innerText;
      submitBtn.disabled = true;
      submitBtn.innerText = filesToUpload.length > 0 ? 'アップロード中...' : '送信中...';
      if (filesToUpload.length > 0) cancelUploadBtn.classList.remove('hidden');

      // 楽観的更新
      const tempId = 'optimistic_post_' + Date.now();
      const tempPost = document.createElement('div');
      tempPost.id = tempId;
      tempPost.className = 'bg-white p-3 border border-gray-300 rounded text-sm shadow-sm optimistic-post';
      let optimisticBadge = '';
      if (parentIdForPost && replyToNumber) {
        optimisticBadge = `<span class="reply-badge">>>${replyToNumber}</span>`;
      }
      const optimisticIndex = latestPosts.length + 1;

      // ファイルごとの進捗バー
      let filesProgressHtml = '';
      if (filesToUpload.length > 0) {
        filesProgressHtml = `<div class="mt-2 space-y-2">`;
        filesToUpload.forEach((f, i) => {
          let icon = '📎';
          if (f.type.startsWith('image/')) icon = '🖼';
          else if (f.type.startsWith('video/')) icon = '🎬';
          else if (f.type.startsWith('audio/')) icon = '🎵';
          else if (f.type === 'application/pdf') icon = '📄';
          else if (f.type.startsWith('text/')) icon = '📝';

          filesProgressHtml += `
            <div class="file-preview-item">
              <div class="file-preview-icon">${icon}</div>
              <div class="file-preview-info">
                <div class="file-preview-name">${escapeHtml(f.name)}</div>
                <div class="progress-bar-container">
                  <div class="progress-bar-fill" id="prog_${tempId}_${i}" style="width: 0%"></div>
                </div>
              </div>
            </div>`;
        });
        filesProgressHtml += `</div>`;
      }

      tempPost.innerHTML = `
        <div class="font-bold text-gray-700 mb-1 flex flex-wrap items-baseline gap-x-1">
          <span class="post-number">${optimisticIndex}</span>
          <span>：</span>
          <span class="post-author">名無しさん</span>
          <span>：</span>
          <span class="text-gray-500 text-xs font-normal">送信中...</span>
        </div>
        <div class="text-gray-900 whitespace-pre-wrap mb-1 break-words">${optimisticBadge}${formatContent(content)}</div>
        ${filesProgressHtml}`;
      postsContainer.appendChild(tempPost);
      tempPost.scrollIntoView({ behavior: 'smooth', block: 'end' });

      document.getElementById('postForm').reset();
      cancelReply();
      clearSelectedFiles();

      try {
        let uploadedFiles = [];
        if (filesToUpload.length > 0) {
          const uploadPromises = filesToUpload.map((file, i) =>
            uploadFileWithProgress(file, (pct) => {
              const el = document.getElementById(`prog_${tempId}_${i}`);
              if (el) el.style.width = pct.toFixed(1) + '%';
            })
          );
          uploadedFiles = await Promise.all(uploadPromises);
        }

        const newPostRef = push(ref(db, `threads/${currentThreadKey}/posts`));
        await set(newPostRef, {
          author: '名無しさん',
          content: content,
          file: uploadedFiles[0] || null, // 後方互換
          files: uploadedFiles.length > 0 ? uploadedFiles : null,
          createdAt: Date.now(),
          parentId: parentIdForPost || null,
          replyTo: replyToNumber || null
        });

        const threadRef = ref(db, `threads/${currentThreadKey}`);
        const countSnapshot = await new Promise((resolve) => {
          onValue(threadRef, resolve, { onlyOnce: true });
        });
        const currentCount = (countSnapshot.val() && countSnapshot.val().postCount) || 0;
        await update(threadRef, { postCount: currentCount + 1 });

        showBanner(`${uploadedFiles.length > 0 ? uploadedFiles.length + '件のファイルを' : ''}保存しました`, false);
        const el = document.getElementById(tempId);
        if (el) el.remove();
      } catch (error) {
        console.error("投稿エラー:", error);
        const el = document.getElementById(tempId);
        if (el) el.remove();
        showBanner('保存失敗: ' + (error.code || error.message || ''), true);
        alert(`書き込みに失敗しました: ${error.message || '不明なエラー'}`);
      } finally {
        isUploading = false;
        currentUploadTasks = [];
        cancelUploadBtn.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
      }
    });

    // ============================================================
    // 初期化
    // ============================================================
    initThreadsListener();

    window.addEventListener('beforeunload', () => {
      if (postsUnsubscribe) postsUnsubscribe();
      if (threadsUnsubscribe) threadsUnsubscribe();
      selectedFiles.forEach(s => { if (s.previewUrl) URL.revokeObjectURL(s.previewUrl); });
    });

    window.addEventListener('unhandledrejection', (event) => {
      console.error('未処理のPromiseエラー:', event.reason);
    });
  </script>
</body>
</html>

    // ============================================================

    // ============================================================

    function setConnection(online) {
      if (online) {

        connText.textContent = 'オンライン（リアルタイム同期中）';

    }
    function showBanner(msg, isError = true) {
      statusBanner.textContent = msg;
      statusBanner.className = (isError ? 'bg-red-600' : 'bg-green-600') + ' text-white show';
      statusBanner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;text-align:center;padding:6px;font-size:12px;transform:translateY(0);';
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => {
        statusBanner.style.transform = 'translateY(-100%)';
      }, 4000);
    }
    window.addEventListener('online', () => setConnection(true));
    window.addEventListener('offline', () => setConnection(false));

    // ============================================================
    // ユーティリティ
    // ============================================================
    function formatContent(str) {
      if (!str) return '';
      const escaped = escapeHtml(str);
      const urlRegex = /(https?:\/\/[^\s<]+)/g;
      return escaped.replace(urlRegex, (url) =>
        `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline break-all">${url}</a>`);
    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function showMainView() {
      loginView.classList.add('hidden');
      mainView.classList.remove('hidden');

    function showLoginView() {

    // ============================================================
    // 画像処理ユーティリティ
    // ============================================================
    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function loadImage(dataURL) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = dataURL;
      });
    }

    // 画像をリサイズ & 圧縮してBase64を返す
    async function compressImage(file) {
      const dataURL = await fileToDataURL(file);
      const img = await loadImage(dataURL);

      let { width, height } = img;
      if (width > MAX_IMAGE_DIMENSION || height > MAX_IMAGE_DIMENSION) {
        const ratio = Math.min(MAX_IMAGE_DIMENSION / width, MAX_IMAGE_DIMENSION / height);
        width = Math.round(width * ratio);
        height = Math.round(height * ratio);
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      // 透過PNGは白背景にする
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);

      // JPEGとして圧縮
      let quality = IMAGE_QUALITY;
      let outDataURL = canvas.toDataURL('image/jpeg', quality);

      // まだ大きければ品質を下げる
      while (outDataURL.length > MAX_IMAGE_SIZE * 1.37 && quality > 0.2) {
        quality -= 0.1;
        outDataURL = canvas.toDataURL('image/jpeg', quality);
      }

      return outDataURL;
    }

    // 画像配列を安全に検証（読み込み時）
    function sanitizeImages(images) {
      if (!images) return [];
      if (!Array.isArray(images)) return [];
      return images.filter(img =>
        typeof img === 'string' && img.startsWith('data:image/')
      );
    }

    // 画像モーダル表示
    window.showImageModal = function(src) {
      const modal = document.createElement('div');
      modal.className = 'image-modal';
      modal.innerHTML = `
        <span class="close-modal">&times;</span>
        <img src="${src}" alt="拡大画像">
      `;
      modal.addEventListener('click', (e) => {
        if (e.target === modal || e.target.classList.contains('close-modal')) {
          modal.remove();
        }
      });
      document.addEventListener('keydown', function escHandler(e) {
        if (e.key === 'Escape') {
          modal.remove();
          document.removeEventListener('keydown', escHandler);
        }
      });
      document.body.appendChild(modal);
    };

    // 画像プレビュー描画
    function renderImagePreview(container, images, onRemove) {
      container.innerHTML = '';
      images.forEach((img, idx) => {
        const item = document.createElement('div');
        item.className = 'image-preview-item';
        item.innerHTML = `
          <img src="${img}" alt="プレビュー">
          <button class="remove-img" type="button" title="削除">×</button>
        `;
        item.querySelector('.remove-img').addEventListener('click', () => {
          images.splice(idx, 1);
          onRemove();
        });
        container.appendChild(item);
      });
    }

    // 画像選択ハンドラ（汎用）
    async function handleImageSelect(files, imagesArray, previewContainer, renderFn) {
      const remaining = MAX_IMAGES_PER_POST - imagesArray.length;
      if (remaining <= 0) {
        alert(`画像は最大${MAX_IMAGES_PER_POST}枚までです。`);
        return;
      }
      const selected = Array.from(files).slice(0, remaining);
      for (const file of selected) {
        if (!file.type.startsWith('image/')) {
          alert('画像ファイルのみ添付できます。');
          continue;
        }
        try {
          const compressed = await compressImage(file);
          if (compressed.length > MAX_IMAGE_SIZE * 1.37) {
            alert(`画像「${file.name}」は圧縮しても大きすぎます。別の画像を選んでください。`);
            continue;
          }
          imagesArray.push(compressed);
        } catch (e) {
          console.error('画像処理エラー:', e);
          alert(`画像「${file.name}」の処理に失敗しました。`);
        }
      }
      renderFn();
    }

    // ============================================================
    // 画像入力のセットアップ
    // ============================================================
    function setupImageInputs() {
      // スレッド作成用
      const firstInput = document.getElementById('firstPostImageInput');
      const firstPreview = document.getElementById('firstPostImagePreview');
      const renderFirst = () => renderImagePreview(firstPreview, firstPostImages, renderFirst);
      firstInput.addEventListener('change', async (e) => {
        await handleImageSelect(e.target.files, firstPostImages, firstPreview, renderFirst);
        e.target.value = '';
      });

      // レス投稿用
      const postInput = document.getElementById('postImageInput');
      const postPreview = document.getElementById('postImagePreview');
      const renderPost = () => renderImagePreview(postPreview, postImages, renderPost);
      postInput.addEventListener('change', async (e) => {
        await handleImageSelect(e.target.files, postImages, postPreview, renderPost);
        e.target.value = '';
      });
    }

    // ============================================================
    // 認証フロー
    // ============================================================
    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error("ログインエラー:", err);
        if (err.code !== 'auth/popup-closed-by-user') {
          alert("ログインに失敗しました: " + (err.message || ''));
        }
      }
    });

    window.doLogout = async function() {
      if (postsUnsubscribe) { postsUnsubscribe(); postsUnsubscribe = null; }
      if (threadsUnsubscribe) { threadsUnsubscribe(); threadsUnsubscribe = null; }
      try { await signOut(auth); } catch (e) { console.error(e); }
    };

    onAuthStateChanged(auth, (user) => {
      currentUser = user;

      if (!user) {
        isAdmin = false;
        showLoginView();
        return;
      }

      isAdmin = (user.email === ADMIN_EMAIL);

      if (isAdmin) {
        adminBadge.classList.remove('hidden');
        userEmailSpan.classList.remove('hidden');
        userEmailSpan.textContent = user.email + '（管理者）';
        userEmailSpan.className = 'text-xs text-red-700 font-bold';
      } else {
        adminBadge.classList.add('hidden');
        userEmailSpan.classList.add('hidden');
        userEmailSpan.textContent = '';
      }

      showMainView();
      setConnection(navigator.onLine);

      showThreadList();
      initThreadsListener();
    });

    // ============================================================
    // 画面切り替え
    // ============================================================
    window.showThreadList = function() {
      threadListView.classList.remove('hidden');
      threadDetailView.classList.add('hidden');
      backToListBtn.classList.add('hidden');
      currentThreadKey = null;
      activeReplyParentId = null;
      if (postsUnsubscribe) { postsUnsubscribe(); postsUnsubscribe = null; }
      postElementMap = new Map();
      allPostsCache = [];
      postNumberMap = new Map();
      postsContainer.innerHTML = '<p class="text-gray-500 text-sm">読み込み中...</p>';
    };

    function openThread(threadKey, title, createdAt, authorEmail) {
      currentThreadKey = threadKey;
      activeReplyParentId = null;
      document.getElementById('currentThreadTitle').innerText = title;
      document.getElementById('currentThreadDate').innerText = '作成日時: ' + createdAt;

      const authorEl = document.getElementById('currentThreadAuthor');
      const delBtn = document.getElementById('deleteThreadBtn');
      if (isAdmin) {
        authorEl.textContent = '作成者: ' + (authorEmail || '不明');
        authorEl.className = 'text-xs text-red-700 font-bold mt-1';
        delBtn.classList.remove('hidden');
      } else {
        authorEl.textContent = '';
        delBtn.classList.add('hidden');
      }

      threadListView.classList.add('hidden');
      threadDetailView.classList.remove('hidden');
      backToListBtn.classList.remove('hidden');

      loadPosts(threadKey);
    }

    // ============================================================
    // 1. スレッド作成
    // ============================================================
    document.getElementById('createThreadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) { alert('ログインが必要です。'); return; }

      const title = document.getElementById('threadTitle').value.trim();
      const content = document.getElementById('firstPostContent').value.trim();
      const btn = document.getElementById('createThreadBtn');

      if (!title) { alert('スレッドタイトルを入力してください。'); return; }

      btn.disabled = true;
      btn.innerText = '作成中...';

      const tempKey = 'temp_' + Date.now();
      const tempItem = document.createElement('div');
      tempItem.id = 'optimistic_thread_' + tempKey;
      tempItem.className = 'bg-white p-3 border border-gray-300 rounded flex justify-between items-center shadow-sm optimistic-item';
      tempItem.innerHTML = `
        <div class="flex-1 min-w-0">
          <span class="font-bold text-blue-900 break-words">${escapeHtml(title)}</span>
          <span class="text-xs text-gray-400 ml-2 whitespace-nowrap">(送信中...)</span>
        </div>`;
      threadsContainer.prepend(tempItem);

      document.getElementById('createThreadForm').reset();
      firstPostImages = [];
      document.getElementById('firstPostImagePreview').innerHTML = '';

      try {
        const threadsRef = ref(db, 'threads');
        const newThreadRef = push(threadsRef);
        const threadKey = newThreadRef.key;

        const threadData = {
          title: title,
          createdAt: Date.now(),
          postCount: content || firstPostImages.length > 0 ? 1 : 0,
          authorEmail: currentUser.email,
          authorUid: currentUser.uid
        };

        const writes = [set(newThreadRef, threadData)];

        if (content || firstPostImages.length > 0) {
          const postRef = push(ref(db, `threads/${threadKey}/posts`));
          const postData = {
            author: '名無しさん',
            content: content || '',
            createdAt: Date.now(),
            authorEmail: currentUser.email,
            authorUid: currentUser.uid,
            parentId: null
          };
          if (firstPostImages.length > 0) {
            postData.images = firstPostImages.slice();
          }
          writes.push(set(postRef, postData));
        }

        await Promise.all(writes);
        showBanner('スレッドを保存しました', false);
        const tempEl = document.getElementById('optimistic_thread_' + tempKey);
        if (tempEl) tempEl.remove();
      } catch (err) {
        console.error("スレッド作成エラー:", err);
        const el = document.getElementById('optimistic_thread_' + tempKey);
        if (el) el.remove();
        showBanner('保存失敗: ' + (err.code || err.message || 'ネットワークエラー'), true);
        alert("スレッドの作成に失敗しました。\n" + (err.message || ''));
      } finally {
        btn.disabled = false;
        btn.innerText = 'スレッドを立てる';
      }
    });

    // ============================================================
    // 2. スレッド一覧 リアルタイム監視
    // ============================================================
    function initThreadsListener() {
      if (threadsUnsubscribe) threadsUnsubscribe();

      const threadsRef = ref(db, 'threads');
      const q = query(threadsRef, orderByChild('createdAt'));

      threadsUnsubscribe = onValue(q, (snapshot) => {
        setConnection(true);
        threadsContainer.innerHTML = '';

        if (!snapshot.exists()) {
          threadsContainer.innerHTML = '<p class="text-gray-500 text-sm">スレッドがありません。新しく作成してください。</p>';
          return;
        }

        const threads = [];
        snapshot.forEach((child) => {
          threads.push({ key: child.key, ...child.val() });
        });
        threads.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        const frag = document.createDocumentFragment();
        threads.forEach((thread) => {
          let date = '日時不明';
          if (thread.createdAt) {
            try { date = new Date(thread.createdAt).toLocaleString('ja-JP'); }
            catch (e) { date = '日時不明'; }
          }

          const item = document.createElement('div');
          item.className = 'bg-white p-3 border border-gray-300 rounded hover:bg-amber-50 cursor-pointer transition flex justify-between items-center shadow-sm';
          item.onclick = () => openThread(thread.key, thread.title, date, thread.authorEmail);
          item.innerHTML = `
            <div class="flex-1 min-w-0">
              <span class="font-bold text-blue-900 break-words">${escapeHtml(thread.title)}</span>
              <span class="text-xs text-gray-400 ml-2 whitespace-nowrap">(${date})</span>
            </div>
            <span class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded-full ml-2 whitespace-nowrap">開く</span>`;
          frag.appendChild(item);
        });
        threadsContainer.appendChild(frag);
      }, (error) => {
        console.error("スレッド一覧の取得エラー:", error);
        setConnection(false);
        threadsContainer.innerHTML =
          '<p class="text-red-500 text-sm">スレッド一覧の読み込みに失敗しました。<br>' +
          'Realtime Database のルールを確認してください。</p>';
        showBanner('読み込み失敗: ' + (error.code || error.message), true);
      });
    }

    // ============================================================
    // 3. レス読み込み（ツリー構築・画像対応）
    // ============================================================
    function loadPosts(threadKey) {
      if (postsUnsubscribe) { postsUnsubscribe(); postsUnsubscribe = null; }
      postsContainer.innerHTML = '<p class="text-gray-500 text-sm"><span class="loading-spinner"></span> 読み込み中...</p>';

      postElementMap = new Map();

      const postsRef = ref(db, `threads/${threadKey}/posts`);
      const q = query(postsRef, orderByChild('createdAt'), limitToLast(POST_FETCH_LIMIT));

      postsUnsubscribe = onValue(q, (snapshot) => {
        setConnection(true);

        postsContainer.innerHTML = '';
        postElementMap = new Map();

        if (!snapshot.exists()) {
          allPostsCache = [];
          postNumberMap = new Map();
          postsContainer.innerHTML = '<p class="text-gray-500 text-sm">まだ書き込みがありません。</p>';
          return;
        }

        const posts = [];
        snapshot.forEach((child) => {
          posts.push({ key: child.key, ...child.val() });
        });

        posts.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        allPostsCache = posts;

        postNumberMap = new Map();
        posts.forEach((p, i) => {
          postNumberMap.set(p.key, i + 1);
        });

        const childrenMap = new Map();
        const rootPosts = [];
        const keySet = new Set(posts.map(p => p.key));

        posts.forEach((p) => {
          let pid = p.parentId || null;
          if (pid && !keySet.has(pid)) pid = null;

          if (pid === null) {
            rootPosts.push(p);
          } else {
            if (!childrenMap.has(pid)) childrenMap.set(pid, []);
            childrenMap.get(pid).push(p);
          }
        });

        const frag = document.createDocumentFragment();
        rootPosts.forEach((p) => {
          frag.appendChild(renderPostTree(p, childrenMap));
        });
        postsContainer.appendChild(frag);

        if (activeReplyParentId && keySet.has(activeReplyParentId)) {
          openReplyBox(activeReplyParentId);
        } else {
          activeReplyParentId = null;
        }
      }, (error) => {
        console.error("レス読み込みエラー:", error);
        setConnection(false);
        postsContainer.innerHTML = '<p class="text-red-500 text-sm">レス一覧の読み込みに失敗しました。</p>';
        showBanner('レス読み込み失敗: ' + (error.code || error.message), true);
      });
    }

    // ★ 再帰的に1つのレス＋その子レスたちを描画（画像対応）
    function renderPostTree(post, childrenMap) {
      const wrap = document.createElement('div');
      wrap.className = 'post-tree';
      wrap.dataset.postKey = post.key;
      postElementMap.set(post.key, wrap);

      const number = postNumberMap.get(post.key) || '?';
      let date = '送信中...';
      if (post.createdAt) {
        try { date = new Date(post.createdAt).toLocaleString('ja-JP'); }
        catch (e) { date = '日時不明'; }
      }

      let adminInfo = '';
      if (isAdmin) {
        adminInfo = `<span class="admin-email">${escapeHtml(post.authorEmail || 'メール不明')}</span>`;
      }

      let replyLabel = '';
      if (post.parentId && postNumberMap.has(post.parentId)) {
        const parentNum = postNumberMap.get(post.parentId);
        replyLabel = `<span class="reply-target-label">↩ &gt;&gt;${parentNum}</span>`;
      }

      // 画像HTML生成
      const images = sanitizeImages(post.images);
      let imagesHtml = '';
      if (images.length > 0) {
        imagesHtml = '<div class="flex flex-wrap gap-2 mt-1">' +
          images.map((img, i) =>
            `<img src="${img}" class="post-image" alt="添付画像${i+1}" onclick="showImageModal('${img.replace(/'/g, "\\'")}')">`
          ).join('') +
          '</div>';
      }

      const postDiv = document.createElement('div');
      postDiv.className = 'post-card';
      postDiv.innerHTML = `
        <div class="font-bold text-gray-700 mb-1 flex flex-wrap items-baseline gap-x-1 items-center">
          <span class="post-number">${number}</span>
          <span>：</span>
          <span class="post-author">${escapeHtml(post.author || '名無しさん')}</span>
          <span>：</span>
          <span class="text-gray-500 text-xs font-normal">${date}</span>
          ${adminInfo}
          <span class="ml-auto flex gap-1">
            <button class="reply-btn" data-reply-key="${post.key}">返信</button>
            ${isAdmin ? `<button class="delete-btn" data-post-key="${post.key}">削除</button>` : ''}
          </span>
        </div>
        ${post.content ? `<div class="text-gray-900 whitespace-pre-wrap mb-1 break-words">${formatContent(post.content)}</div>` : ''}
        ${imagesHtml}
        ${replyLabel ? `<div class="mt-1">${replyLabel}</div>` : ''}
      `;

      const rbtn = postDiv.querySelector('.reply-btn');
      if (rbtn) {
        rbtn.addEventListener('click', () => onReplyClick(post.key));
      }
      if (isAdmin) {
        const dbtn = postDiv.querySelector('.delete-btn');
        if (dbtn) {
          dbtn.addEventListener('click', () => deletePost(currentThreadKey, post.key, postNumberMap.get(post.key)));
        }
      }

      wrap.appendChild(postDiv);

      const children = childrenMap.get(post.key) || [];
      if (children.length > 0) {
        const childWrap = document.createElement('div');
        childWrap.className = 'post-children';
        children.forEach((c) => {
          childWrap.appendChild(renderPostTree(c, childrenMap));
        });
        wrap.appendChild(childWrap);
      }

      return wrap;
    }

    // ★ 返信ボタン
    function onReplyClick(parentId) {
      if (!currentUser) { alert('ログインが必要です。'); return; }
      if (activeReplyParentId === parentId) {
        closeReplyBox();
        return;
      }
      activeReplyParentId = parentId;
      replyImages = [];
      openReplyBox(parentId);
    }

    // ★ 返信ボックスを開く（画像対応）
    function openReplyBox(parentId) {
      document.querySelectorAll('.inline-reply-box').forEach(el => el.remove());

      const targetWrap = postElementMap.get(parentId);
      if (!targetWrap) return;

      const targetCard = targetWrap.querySelector('.post-card');
      if (!targetCard) return;

      const parentNum = postNumberMap.get(parentId) || '?';

      const box = document.createElement('div');
      box.className = 'inline-reply-box';
      box.innerHTML = `
        <div class="reply-target-label">&gt;&gt;${parentNum} への返信</div>
        <textarea class="reply-textarea" placeholder="返信を入力（最大2000文字）" maxlength="2000"></textarea>
        <div class="mt-2">
          <label class="image-upload-label">
            📷 画像を添付
            <input type="file" class="reply-image-input" accept="image/*" multiple>
          </label>
          <div class="reply-image-preview image-preview-container"></div>
        </div>
        <div class="flex justify-end gap-2 mt-2">
          <button class="reply-cancel-btn">キャンセル</button>
          <button class="reply-send-btn bg-red-800 hover:bg-red-900 text-white text-xs py-1.5 px-4 rounded">返信する</button>
        </div>
      `;

      targetCard.insertAdjacentElement('afterend', box);

      const ta = box.querySelector('.reply-textarea');
      const cancelBtn = box.querySelector('.reply-cancel-btn');
      const sendBtn = box.querySelector('.reply-send-btn');
      const replyImgInput = box.querySelector('.reply-image-input');
      const replyImgPreview = box.querySelector('.reply-image-preview');

      const renderReplyPreview = () => renderImagePreview(replyImgPreview, replyImages, renderReplyPreview);

      replyImgInput.addEventListener('change', async (e) => {
        await handleImageSelect(e.target.files, replyImages, replyImgPreview, renderReplyPreview);
        e.target.value = '';
      });

      cancelBtn.addEventListener('click', () => {
        activeReplyParentId = null;
        replyImages = [];
        box.remove();
      });

      sendBtn.addEventListener('click', async () => {
        const content = ta.value.trim();
        if (!content && replyImages.length === 0) {
          alert('返信内容または画像を入力してください。');
          return;
        }
        sendBtn.disabled = true;
        sendBtn.textContent = '送信中...';
        try {
          await submitReply(parentId, content, replyImages);
          activeReplyParentId = null;
          replyImages = [];
          box.remove();
        } catch (err) {
          sendBtn.disabled = false;
          sendBtn.textContent = '返信する';
        }
      });

      ta.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          sendBtn.click();
        }
      });

      ta.focus();
    }

    function closeReplyBox() {
      activeReplyParentId = null;
      replyImages = [];
      document.querySelectorAll('.inline-reply-box').forEach(el => el.remove());
    }

    // ★ 返信を保存
    async function submitReply(parentId, content, images) {
      if (!currentUser) throw new Error('ログインが必要です');
      if (!currentThreadKey) throw new Error('スレッドが選択されていません');

      const postsRef = ref(db, `threads/${currentThreadKey}/posts`);
      const newPostRef = push(postsRef);
      const data = {
        author: '名無しさん',
        content: content || '',
        createdAt: Date.now(),
        authorEmail: currentUser.email,
        authorUid: currentUser.uid,
        parentId: parentId
      };
      if (images && images.length > 0) {
        data.images = images.slice();
      }
      await set(newPostRef, data);
      showBanner('返信を保存しました', false);
    }

    // ============================================================
    // 4. レス投稿（トップレベル・画像対応）
    // ============================================================
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) { alert('ログインが必要です。'); return; }
      if (!currentThreadKey) { alert('スレッドが選択されていません。'); return; }

      const content = document.getElementById('postContent').value.trim();
      const submitBtn = document.getElementById('submitBtn');

      if (!content && postImages.length === 0) {
        alert('コメントまたは画像を入力してください。');
        return;
      }

      const originalText = submitBtn.innerText;
      submitBtn.disabled = true;
      submitBtn.innerText = '送信中...';

      const tempId = 'optimistic_post_' + Date.now();
      const tempPost = document.createElement('div');
      tempPost.id = tempId;
      tempPost.className = 'post-card optimistic-post';
      const optimisticIndex = allPostsCache.length + 1;
      tempPost.innerHTML = `
        <div class="font-bold text-gray-700 mb-1 flex flex-wrap items-baseline gap-x-1">
          <span class="post-number">${optimisticIndex}</span>
          <span>：</span>
          <span class="post-author">名無しさん</span>
          <span>：</span>
          <span class="text-gray-500 text-xs font-normal">送信中...</span>
        </div>
        ${content ? `<div class="text-gray-900 whitespace-pre-wrap mb-2 break-words">${formatContent(content)}</div>` : ''}
        ${postImages.length > 0 ? `<div class="flex flex-wrap gap-2 mt-1">${postImages.map(img => `<img src="${img}" class="post-image" alt="添付画像">`).join('')}</div>` : ''}
      `;
      postsContainer.appendChild(tempPost);
      tempPost.scrollIntoView({ behavior: 'smooth', block: 'end' });

      document.getElementById('postForm').reset();
      const imagesToSend = postImages.slice();
      postImages = [];
      document.getElementById('postImagePreview').innerHTML = '';

      try {
        const postsRef = ref(db, `threads/${currentThreadKey}/posts`);
        const newPostRef = push(postsRef);
        const data = {
          author: '名無しさん',
          content: content || '',
          createdAt: Date.now(),
          authorEmail: currentUser.email,
          authorUid: currentUser.uid,
          parentId: null
        };
        if (imagesToSend.length > 0) {
          data.images = imagesToSend;
        }
        await set(newPostRef, data);

        showBanner('書き込みを保存しました', false);
        const el = document.getElementById(tempId);
        if (el) el.remove();
      } catch (error) {
        console.error("投稿エラー:", error);
        const el = document.getElementById(tempId);
        if (el) el.remove();
        showBanner('保存失敗: ' + (error.code || error.message || ''), true);
        alert(`書き込みに失敗しました: ${error.message || '不明なエラー'}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
      }
    });

    // ============================================================
    // 5. 管理者用：レス削除
    // ============================================================
    window.deletePost = async function(threadKey, postKey, index) {
      if (!isAdmin) { alert('管理者のみ削除できます。'); return; }

      const hasChildren = allPostsCache.some(p => p.parentId === postKey);
      const msg = hasChildren
        ? `レス #${index} を削除しますか？\n※ このレスへの返信もすべて削除されます。\nこの操作は取り消せません。`
        : `レス #${index} を削除しますか？\nこの操作は取り消せません。`;
      if (!confirm(msg)) return;

      try {
        const toDelete = collectDescendants(postKey);
        toDelete.push(postKey);

        for (const key of toDelete) {
          await remove(ref(db, `threads/${threadKey}/posts/${key}`));
        }

        showBanner('レスを削除しました', false);
      } catch (err) {
        console.error("削除エラー:", err);
        showBanner('削除失敗: ' + (err.code || err.message), true);
        alert('削除に失敗しました。');
      }
    };

    function collectDescendants(parentKey) {
      const result = [];
      const stack = [parentKey];
      while (stack.length) {
        const cur = stack.pop();
        allPostsCache.forEach(p => {
          if (p.parentId === cur) {
            result.push(p.key);
            stack.push(p.key);
          }
        });
      }
      return result;
    }

    // ============================================================
    // 6. 管理者用：スレッド削除
    // ============================================================
    window.deleteCurrentThread = async function() {
      if (!isAdmin) { alert('管理者のみ削除できます。'); return; }
      if (!currentThreadKey) return;
      if (!confirm('このスレッドをすべてのレスごと削除しますか？\nこの操作は取り消せません。')) return;

      const key = currentThreadKey;
      try {
        await remove(ref(db, `threads/${key}`));
        showBanner('スレッドを削除しました', false);
        showThreadList();
      } catch (err) {
        console.error("スレッド削除エラー:", err);
        showBanner('削除失敗: ' + (err.code || err.message), true);
        alert('削除に失敗しました。');
      }
    };

    // ============================================================
    // 初期化
    // ============================================================
    setupImageInputs();

    // ============================================================
    // クリーンアップ
    // ============================================================
    window.addEventListener('beforeunload', () => {
      if (postsUnsubscribe) postsUnsubscribe();
      if (threadsUnsubscribe) threadsUnsubscribe();
    });
    window.addEventListener('unhandledrejection', (event) => {
      console.error('未処理のPromiseエラー:', event.reason);
    });
  </script>
</body>

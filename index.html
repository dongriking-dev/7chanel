  <style>
    .threads-scroll { max-height: 480px; overflow-y: auto; scrollbar-width: thin; }

    .post-author { color: #15803d; font-weight: 600; }
    .loading-spinner {

      border: 2px solid #f3f3f3; border-top: 2px solid #991b1b;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .optimistic-item { opacity: 0.55; pointer-events: none; position: relative; }
    .optimistic-item::after {
      content: "送信中..."; position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%); font-size: 10px; color: #991b1b;
      background: #fef2f2; padding: 2px 6px; border-radius: 4px; border: 1px solid #fecaca;
    }
    .optimistic-post { opacity: 0.6; border-left: 3px solid #f59e0b !important; }

      width: 100%;
      height: 100%;
      pointer-events: none;

    function formatContent(str) {
      if (!str) return '';
      const escaped = escapeHtml(str);
      const urlRegex = /(https?:\/\/[^\s<]+)/g;
      return escaped.replace(urlRegex, (url) =>
        `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline break-all">${url}</a>`);
    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function fileToBase64Image(file) {
      return new Promise((resolve, reject) => {
        if (!file) { resolve(null); return; }
        if (!file.type.startsWith('image/')) {
          reject(new Error('画像ファイルを選択してください'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました'));
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
          img.onload = () => {
            let { width, height } = img;
            if (width > IMAGE_MAX_WIDTH) {
              height = Math.round(height * (IMAGE_MAX_WIDTH / width));
              width = IMAGE_MAX_WIDTH;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            let quality = IMAGE_QUALITY;
            let dataUrl = canvas.toDataURL('image/jpeg', quality);
            while (dataUrl.length > IMAGE_MAX_BASE64_SIZE && quality > 0.3) {
              quality -= 0.1;
              dataUrl = canvas.toDataURL('image/jpeg', quality);
            }
            if (dataUrl.length > IMAGE_MAX_BASE64_SIZE) {
              reject(new Error('画像が大きすぎます。別の画像を選んでください。'));
              return;
            }
            resolve({
              dataUrl: dataUrl,
              name: file.name,
              type: 'image/jpeg',
              width: width,
              height: height,
              size: dataUrl.length
            });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function buildFileHtml(file) {
      if (!file || !file.dataUrl) return '';
      const name = file.name || '添付画像';
      const dataUrl = file.dataUrl;
      return `
        <div class="post-file">
          <a href="${dataUrl}" target="_blank" rel="noopener noreferrer">
            <img src="${dataUrl}" alt="${escapeHtml(name)}" loading="lazy">
          </a>
          <a href="${dataUrl}" download="${escapeHtml(name)}">📎 ${escapeHtml(name)}（${formatSize(file.size)}）</a>
        </div>`;
    }
    function formatSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    }

    async function updatePreview(fileInput, boxId, imgId, infoId) {
      const file = fileInput.files[0];
      const box = document.getElementById(boxId);
      const img = document.getElementById(imgId);
      const info = document.getElementById(infoId);
      if (!file) {
        box.classList.remove('show');
        img.src = '';
        info.textContent = '';
        return null;
      }
      try {
        const result = await fileToBase64Image(file);
        img.src = result.dataUrl;
        info.textContent = `${file.name}（${result.width}×${result.height}, ${formatSize(result.size)}）`;
        box.classList.add('show');
        return result;
      } catch (err) {
        alert(err.message);
        fileInput.value = '';
        box.classList.remove('show');
        return null;
      }
    }

    function initThreadsListener() {
      if (threadsUnsubscribe) threadsUnsubscribe();

      const threadsRef = ref(db, 'threads');
      const q = query(threadsRef, orderByChild('createdAt'));

      threadsUnsubscribe = onValue(q, (snapshot) => {
        setConnection(true);
        threadsContainer.innerHTML = '';

        if (!snapshot.exists()) {
          threadsContainer.innerHTML = '<p class="text-gray-500 text-sm">スレッドがありません。新しく作成してください。</p>';
          return;
        }

        const threads = [];
        snapshot.forEach((child) => {
          threads.push({ key: child.key, ...child.val() });
        });
        threads.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        threads.forEach((thread) => {
          let date = '日時不明';
          if (thread.createdAt) {
            try { date = new Date(thread.createdAt).toLocaleString('ja-JP'); }
            catch (e) { date = '日時不明'; }
          }

          const item = document.createElement('div');
          item.className = 'bg-white p-3 border border-gray-300 rounded hover:bg-amber-50 cursor-pointer transition flex justify-between items-center shadow-sm';
          item.onclick = () => openThread(thread.key, thread.title, date, thread.authorEmail, thread.authorUid);
          item.innerHTML = `
            <div class="flex-1 min-w-0">
              <span class="font-bold text-blue-900 break-words">${escapeHtml(thread.title)}</span>
              <span class="text-xs text-gray-400 ml-2 whitespace-nowrap">(${date})</span>
            </div>
            <span class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded-full ml-2 whitespace-nowrap">開く</span>`;
          threadsContainer.appendChild(item);
        });
      }, (error) => {
        console.error("スレッド一覧の取得エラー:", error);
        setConnection(false);
        threadsContainer.innerHTML =
          '<p class="text-red-500 text-sm">スレッド一覧の読み込みに失敗しました。<br>' +
          'Realtime Database のルールを確認してください。</p>';
        showBanner('読み込み失敗: ' + (error.code || error.message), true);
      });
    }

    function loadPosts(threadKey) {
      if (postsUnsubscribe) { postsUnsubscribe(); postsUnsubscribe = null; }
      postsContainer.innerHTML = '<p class="text-gray-500 text-sm"><span class="loading-spinner"></span> 読み込み中...</p>';

      const postsRef = ref(db, `threads/${threadKey}/posts`);
      const q = query(postsRef, orderByChild('createdAt'));

      postsUnsubscribe = onValue(q, (snapshot) => {
        setConnection(true);
        postsContainer.innerHTML = '';

        if (!snapshot.exists()) {
          allPostsCache = [];
          postNumberMap = new Map();
          postsContainer.innerHTML = '<p class="text-gray-500 text-sm">まだ書き込みがありません。</p>';
          return;
        }

        const posts = [];
        snapshot.forEach((child) => {
          posts.push({ key: child.key, ...child.val() });
        });
        posts.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        allPostsCache = posts;

        postNumberMap = new Map();
        posts.forEach((p, i) => postNumberMap.set(p.key, i + 1));

        const childrenMap = new Map();
        const rootPosts = [];
        const keySet = new Set(posts.map(p => p.key));

        posts.forEach((p) => {
          let pid = p.parentId || null;
          if (pid && !keySet.has(pid)) pid = null;
          if (pid === null) {
            rootPosts.push(p);
          } else {
            if (!childrenMap.has(pid)) childrenMap.set(pid, []);
            childrenMap.get(pid).push(p);
          }
        });

        const frag = document.createDocumentFragment();
        rootPosts.forEach((p) => frag.appendChild(renderPostTree(p, childrenMap)));
        postsContainer.appendChild(frag);

        if (activeReplyParentId && keySet.has(activeReplyParentId)) {
          openReplyBox(activeReplyParentId);
        } else {
          activeReplyParentId = null;
        }
      }, (error) => {
        console.error("レス読み込みエラー:", error);
        setConnection(false);
        postsContainer.innerHTML = '<p class="text-red-500 text-sm">レス一覧の読み込みに失敗しました。</p>';
        showBanner('レス読み込み失敗: ' + (error.code || error.message), true);
      });
    }

    function buildPostRoleBadge(post) {
      if (!post) return '';
      if (post.badgeVisible === false) return '';
      const role = post.authorRole;
      if (role === 'admin') return `<span class="role-post-badge admin">管理者</span>`;
      if (role === 'owner') return `<span class="role-post-badge owner">主</span>`;
      if (role === 'vip')   return `<span class="role-post-badge vip">VIP</span>`;
      return '';
    }

    function renderPostTree(post, childrenMap) {
      const wrap = document.createElement('div');
      wrap.className = 'post-tree';
      wrap.dataset.postKey = post.key;

      const number = postNumberMap.get(post.key) || '?';
      let date = '送信中...';
      if (post.createdAt) {
        try { date = new Date(post.createdAt).toLocaleString('ja-JP'); }
        catch (e) { date = '日時不明'; }
      }

      let opBadge = '';
      if (currentThreadOwnerUid && post.authorUid === currentThreadOwnerUid) {
        opBadge = `<span class="op-badge">スレ主</span>`;
      }

      const roleBadgeHtml = buildPostRoleBadge(post);

      let adminInfo = '';
      if (canViewEmail()) {
        adminInfo = `<span class="admin-email">${escapeHtml(post.authorEmail || 'メール不明')}</span>`;
      }

      let replyLabel = '';
      if (post.parentId && postNumberMap.has(post.parentId)) {
        const parentNum = postNumberMap.get(post.parentId);
        replyLabel = `<span class="reply-target-label">↩ >>${parentNum}</span>`;
      }

      const fileHtml = post.file ? buildFileHtml(post.file) : '';

      const postDiv = document.createElement('div');
      postDiv.className = 'post-card';
      postDiv.dataset.postKey = post.key;
      postDiv.innerHTML = `
        <div class="font-bold text-gray-700 mb-1 flex flex-wrap items-baseline gap-x-1 items-center">
          <span class="post-number">${number}</span>
          <span>：</span>
          <span class="post-author">${escapeHtml(post.author || '名無しさん')}</span>
          ${opBadge}
          ${roleBadgeHtml}
          <span>：</span>
          <span class="text-gray-500 text-xs font-normal">${date}</span>
          ${adminInfo}
          <span class="ml-auto flex gap-1">
            <button class="reply-btn" data-reply-key="${post.key}">返信</button>
            ${canDelete() ? `<button class="delete-btn" data-post-key="${post.key}">削除</button>` : ''}
          </span>
        </div>
        <div class="post-content-text text-gray-900 whitespace-pre-wrap mb-1 break-words" data-post-text-key="${post.key}">${post.content ? formatContent(post.content) : ''}</div>
        ${fileHtml}
        ${replyLabel ? `<div class="mt-1">${replyLabel}</div>` : ''}
      `;

      const rbtn = postDiv.querySelector('.reply-btn');
      if (rbtn) rbtn.addEventListener('click', () => onReplyClick(post.key));
      if (canDelete()) {
        const dbtn = postDiv.querySelector('.delete-btn');
        if (dbtn) dbtn.addEventListener('click', () => deletePost(currentThreadKey, post.key, postNumberMap.get(post.key)));
      }

      wrap.appendChild(postDiv);

      const children = childrenMap.get(post.key) || [];
      if (children.length > 0) {
        const childWrap = document.createElement('div');
        childWrap.className = 'post-children';
        children.forEach((c) => childWrap.appendChild(renderPostTree(c, childrenMap)));
        wrap.appendChild(childWrap);
      }

      return wrap;
    }

    function onReplyClick(parentId) {
      if (!currentUser) { alert('ログインが必要です。'); return; }
      if (activeReplyParentId === parentId) { closeReplyBox(); return; }
      activeReplyParentId = parentId;
      openReplyBox(parentId);

    window.deletePost = async function(threadKey, postKey, index) {
      if (!canDelete()) { alert('削除権限がありません。'); return; }

      const hasChildren = allPostsCache.some(p => p.parentId === postKey);
      const msg = hasChildren
        ? `レス #${index} を削除しますか？\n※ このレスへの返信もすべて削除されます。\nこの操作は取り消せません。`
        : `レス #${index} を削除しますか？\nこの操作は取り消せません。`;
      if (!confirm(msg)) return;

      try {
        const toDelete = collectDescendants(postKey);
        toDelete.push(postKey);
        for (const key of toDelete) {
          await remove(ref(db, `threads/${threadKey}/posts/${key}`));
        }
        showBanner('レスを削除しました', false);
      } catch (err) {
        console.error("削除エラー:", err);
        showBanner('削除失敗: ' + (err.code || err.message), true);
        alert('削除に失敗しました。');
      }
    };

    function collectDescendants(parentKey) {
      const result = [];
      const stack = [parentKey];
      while (stack.length) {
        const cur = stack.pop();
        allPostsCache.forEach(p => {
          if (p.parentId === cur) {
            result.push(p.key);
            stack.push(p.key);
          }
        });
      }
      return result;
    }

      try {
        showBanner('バックアップを作成中...', false);
        const snap = await get(ref(db, 'threads'));
        const data = snap.exists() ? snap.val() : {};
        const payload = {
          _meta: {
            exportedAt: new Date().toISOString(),
            exportedBy: currentUser.email,
            app: '69ch'
          },
          threads: data
        };
        const json = JSON.stringify(payload, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        a.href = url;
        a.download = `69ch-backup-${ts}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showBanner('バックアップをダウンロードしました', false);
      } catch (err) {
        console.error("バックアップエラー:", err);
        showBanner('バックアップ失敗: ' + (err.code || err.message), true);

    // 猫キー入力

      if (!catActive) return;

        case 'KeyA': case 'ArrowLeft': catKeys.a = true; break;

        case 'Space': catKeys.space = true; e.preventDefault(); break;
        case 'Enter':

          break;

      switch (e.code) {
        case 'KeyA': case 'ArrowLeft': catKeys.a = false; break;
        case 'KeyD': case 'ArrowRight': catKeys.d = false; break;
        case 'KeyW': case 'ArrowUp': catKeys.w = false; break;

    function clearPostHighlights() {
      document.querySelectorAll('.post-card.cat-hover').forEach(el => el.classList.remove('cat-hover'));

    // ============================================================
    // 猫の更新
    // ============================================================
    function updateCat() {
      const c = catState;
      let moveX = 0, moveY = 0;
      c.isMoving = false;

      if (catKeys.a) { moveX -= 1; c.facingRight = false; c.isMoving = true; }
      if (catKeys.d) { moveX += 1; c.facingRight = true; c.isMoving = true; }
      if (catKeys.w) { moveY -= 1; c.isMoving = true; }
      if (catKeys.s) { moveY += 1; c.isMoving = true; }

      // 水平移動（画面内に制限）
      c.x += moveX * c.speed;
      c.x = Math.max(40, Math.min(window.innerWidth - 40, c.x));

      // 垂直移動（接地時のみ）
      if (moveY !== 0 && c.isGrounded) {
        c.y += moveY * c.speed * 0.7;
      }
      c.y = Math.max(120, Math.min(window.innerHeight - 40, c.y));

      // ジャンプ
      if (catKeys.space && c.isGrounded && !catJumpCooldown && c.jumpPhase === 'none') {
        c.jumpPhase = 'crouch';
        c.jumpAnimT = 0;
        catJumpCooldown = true;
      }
      if (!catKeys.space) catJumpCooldown = false;

      if (c.jumpPhase === 'crouch') {
        c.jumpAnimT++;
        c.crouchAmount = Math.min(1, c.jumpAnimT / 6);
        if (c.jumpAnimT >= 6) {
          c.vz = c.jumpPower;
          c.isGrounded = false;
          c.jumpPhase = 'launch';
          c.jumpAnimT = 0;
        }
      } else if (c.jumpPhase === 'launch') {
        c.jumpAnimT++;
        c.crouchAmount = Math.max(0, 1 - c.jumpAnimT / 5);
        if (c.jumpAnimT >= 5) {
          c.jumpPhase = 'air';
          c.crouchAmount = 0;
        }
      }

      if (!c.isGrounded) {
        c.z += c.vz;
        c.vz -= c.gravity;
        if (c.z <= 0) {
          c.z = 0;
          c.vz = 0;
          c.isGrounded = true;
          if (c.jumpPhase === 'air') {
            c.jumpPhase = 'land';
            c.jumpAnimT = 0;
          }
        }
      }

      if (c.jumpPhase === 'land') {
        c.jumpAnimT++;
        c.crouchAmount = Math.sin(c.jumpAnimT * 0.4) * 0.6;
        if (c.jumpAnimT >= 10) {
          c.jumpPhase = 'none';
          c.crouchAmount = 0;
        }
      }

      // 歩行アニメ
      if (c.isGrounded && c.isMoving) {
        c.walkCycle += 0.36;
        c.idleTime = 0;
      } else if (c.isGrounded) {
        c.walkCycle += 0.02;
        c.idleTime++;
      }
      c.walkCycle %= Math.PI * 2;

      if (c.isGrounded && c.isMoving) {
        c.headBob = Math.sin(c.walkCycle * 2) * 2.5;
      } else {
        c.headBob *= 0.9;
      }

      c.breathPhase += 0.045;
      c.breathPhase %= Math.PI * 2;

      // 尻尾
      let tailTarget;
      if (c.isMoving) {
        tailTarget = Math.sin(c.walkCycle * 0.9) * 0.55 + 0.1;
      } else {
        tailTarget = Math.sin(c.idleTime * 0.04) * 0.25;
      }
      c.tailSwingV += (tailTarget - c.tailPhase) * 0.08;
      c.tailSwingV *= 0.85;
      c.tailPhase += c.tailSwingV;

      // 向き補間
      const targetFacing = c.facingRight ? 1 : -1;
      c.facingScale += (targetFacing - c.facingScale) * 0.25;
      if (Math.abs(c.facingScale - targetFacing) < 0.01) c.facingScale = targetFacing;

      // まばたき
      c.blinkTimer++;
      if (c.blinkTimer > 200) c.eyeBlink = true;
      if (c.blinkTimer > 215) { c.eyeBlink = false; c.blinkTimer = 0; }

      c.earTwitch = Math.sin(Date.now() * 0.0022) * 0.09
                  + Math.sin(Date.now() * 0.008) * 0.03;
    }

    // ============================================================
    // レスとの重なり判定
    // ============================================================
    function updateHoveringPost() {
      const c = catState;
      // 猫の中心ワールド座標
      const catCenterX = c.x;
      const catCenterY = c.y - c.z - 90;   // 猫の胴体中心あたり

      let hoveredKey = null;

      // postsContainer 内の全 post-card を走査
      const cards = document.querySelectorAll('#postsContainer .post-card[data-post-key]');
      cards.forEach((card) => {
        const rect = card.getBoundingClientRect();
        // 猫の中心がカードの矩形内にあるか
        if (catCenterX >= rect.left && catCenterX <= rect.right &&
            catCenterY >= rect.top && catCenterY <= rect.bottom) {
          hoveredKey = card.dataset.postKey;
        }
      });

      // 前フレームの hover をクリア
      if (c.hoveringPostKey && c.hoveringPostKey !== hoveredKey) {
        const prev = document.querySelector(`.post-card[data-post-key="${c.hoveringPostKey}"]`);
        if (prev && !prev.classList.contains('cat-inside')) prev.classList.remove('cat-hover');
      }

      // 新しい hover を反映
      c.hoveringPostKey = hoveredKey;
      if (hoveredKey) {
        const el = document.querySelector(`.post-card[data-post-key="${hoveredKey}"]`);
        if (el && !el.classList.contains('cat-inside')) el.classList.add('cat-hover');
      }
    }

    // Enter キー処理
    async function handleCatEnter() {
      const c = catState;
      // 既に中に入っている場合は編集
      if (c.insidePostKey) {
        openCatEdit(c.insidePostKey);
        return;
      }
      // 重なっているレスがあれば入る
      if (c.hoveringPostKey) {
        const key = c.hoveringPostKey;
        c.insidePostKey = key;
        // ハイライト更新
        document.querySelectorAll('.post-card.cat-hover').forEach(el => el.classList.remove('cat-hover'));
        document.querySelectorAll('.post-card.cat-inside').forEach(el => el.classList.remove('cat-inside'));
        const el = document.querySelector(`.post-card[data-post-key="${key}"]`);
        if (el) {
          el.classList.add('cat-inside');
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        // 猫をレスの中に見えるよう位置を合わせる
        if (el) {
          const rect = el.getBoundingClientRect();
          c.x = rect.left + rect.width / 2;
          c.y = rect.top + rect.height - 40;
          c.z = 0;
          c.vz = 0;
          c.isGrounded = true;
        }
        showBanner('レスに入りました。もう一度 Enter で編集できます', false);
      } else {
        showBanner('レスに重ねてから Enter を押してください', true);
      }
    }

    // ============================================================
    // 編集プロンプト
    // ============================================================
    const catEditPrompt = document.getElementById('catEditPrompt');
    const catEditTextarea = document.getElementById('catEditTextarea');
    const catEditTarget = document.getElementById('catEditTarget');
    let catEditingKey = null;

    function openCatEdit(postKey) {
      if (!canSummonCat()) { alert('編集権限がありません。'); return; }
      const post = allPostsCache.find(p => p.key === postKey);
      if (!post) return;

      catEditingKey = postKey;
      catEditTarget.textContent = `レス #${postNumberMap.get(postKey) || '?'} を編集`;
      catEditTextarea.value = post.content || '';
      catEditPrompt.classList.add('active');
      catEditTextarea.focus();
    }

    window.closeCatEdit = function() {
      catEditPrompt.classList.remove('active');
      catEditingKey = null;
    };

    window.saveCatEdit = async function() {
      if (!catEditingKey || !currentThreadKey) return;
      if (!canSummonCat()) { alert('編集権限がありません。'); return; }

      const newContent = catEditTextarea.value.trim();
      const key = catEditingKey;

      try {
        await update(ref(db, `threads/${currentThreadKey}/posts/${key}`), {
          content: newContent
        });
        showBanner('レスを編集しました', false);
        closeCatEdit();
      } catch (err) {
        console.error('編集エラー:', err);
        showBanner('編集失敗: ' + (err.code || err.message), true);
        alert('編集に失敗しました。');
      }
    };

    // Enterで保存、Escでキャンセル
    catEditTextarea.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        saveCatEdit();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeCatEdit();
      }
    });

    // ============================================================
    // 猫の描画（ゲーム版と同じロジックを流用）
    // ============================================================
    function drawCatOnCanvas() {
      const c = catState;
      const ctx = catCtx;
      ctx.clearRect(0, 0, catCanvas.width, catCanvas.height);

      const baseX = c.x;
      const baseY = c.y - c.z;

      let bodyStretch = 1, bodySquash = 1, airRotation = 0;
      if (c.jumpPhase === 'crouch') {
        bodyStretch = 1 - c.crouchAmount * 0.18;
        bodySquash = 1 + c.crouchAmount * 0.12;
      } else if (c.jumpPhase === 'launch') {
        bodyStretch = 1 + (1 - c.crouchAmount) * 0.14;
        bodySquash = 1 - (1 - c.crouchAmount) * 0.08;
      } else if (!c.isGrounded) {
        const airT = Math.min(1, c.z / 120);
        bodyStretch = 1 + airT * 0.08;
        bodySquash = 1 - airT * 0.05;
        airRotation = c.vz > 0 ? -0.04 : 0.04;
      } else if (c.jumpPhase === 'land') {
        bodyStretch = 1 - c.crouchAmount * 0.14;
        bodySquash = 1 + c.crouchAmount * 0.10;
      }

      let walkBob = 0;
      if (c.isGrounded && c.isMoving) {
        walkBob = Math.abs(Math.sin(c.walkCycle)) * 4;
      }
      const drawY = baseY - walkBob;

      // 影（接地しているY座標に対して）
      const shadowScale = Math.max(0.3, 1 - c.z / 240);
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(baseX, c.y + 4, 58 * shadowScale, 13 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,0,0,${0.35 * shadowScale})`;
      ctx.filter = 'blur(6px)';
      ctx.fill();
      ctx.restore();

      // 本体
      ctx.save();
      ctx.translate(baseX, drawY);
      ctx.rotate(airRotation);
      ctx.scale(c.facingScale, 1);
      const breathScale = 1 + Math.sin(c.breathPhase) * 0.015;
      ctx.scale(bodySquash * (2 - breathScale), bodyStretch * breathScale);

      const phaseFL = c.walkCycle;
      const phaseFR = c.walkCycle + Math.PI;
      const phaseBL = c.walkCycle + Math.PI / 2;
      const phaseBR = c.walkCycle + Math.PI * 1.5;
      const isGroundedWalk = c.isGrounded && c.isMoving;

      function legMotion(phase) {
        if (!isGroundedWalk) return { swing: 0, lift: 0 };
        const swing = Math.sin(phase) * 14;
        const lift = Math.max(0, Math.sin(phase)) * 10;
        return { swing, lift };
      }

      let airLegPose = { front: 0, back: 0 };
      if (!c.isGrounded) {
        const t = Math.min(1, c.z / 100);
        if (c.vz > 0) airLegPose = { front: 15 * t, back: -20 * t };
        else airLegPose = { front: -8 * t, back: 12 * t };
      }

      const mBL = legMotion(phaseBL);
      drawCatLeg(-45, -105, -55 + mBL.swing * 0.6 + airLegPose.back * 0.7, 0 - mBL.lift * 0.7, 13, '#a8875c', '#7a6040');

      const mFL = legMotion(phaseFL);
      drawCatLeg(45, -130, 50 + mFL.swing * 0.6 + airLegPose.front * 0.7, 0 - mFL.lift * 0.7, 11, '#b39268', '#7a6040');

      drawCatTail(-70, -130);
      drawCatBody();

      const mBR = legMotion(phaseBR);
      drawCatLeg(-45, -105, -55 + mBR.swing * 0.7 + airLegPose.back, 0 - mBR.lift, 14, '#c9a87c', '#8a6d4b');

      const mFR = legMotion(phaseFR);
      drawCatLeg(45, -130, 50 + mFR.swing * 0.7 + airLegPose.front, 0 - mFR.lift, 12, '#dbb98a', '#8a6d4b');

      const headYOffset = c.headBob;
      const headXOffset = c.isMoving ? 3 : 0;
      drawCatHead(25 + headXOffset, -190 + headYOffset);

      ctx.restore();
    }

    function drawCatBody() {
      const ctx = catCtx;
      const c = catState;
      const breath = Math.sin(c.breathPhase) * 1.5;

      ctx.beginPath();
      ctx.moveTo(0, -170);
      ctx.bezierCurveTo(-25, -175, -50, -168, -70, -148);
      ctx.bezierCurveTo(-85, -130, -88, -100, -78, -78);
      ctx.bezierCurveTo(-68, -58, -50, -50, -30, -52);
      ctx.bezierCurveTo(-5, -55, 25, -60, 45, -75);
      ctx.bezierCurveTo(65, -90, 72, -115, 65, -140);
      ctx.bezierCurveTo(60, -155, 40, -168, 20, -172);
      ctx.closePath();

      const bodyGrad = ctx.createLinearGradient(-70, -170, 60, -50);
      bodyGrad.addColorStop(0, '#b89366');
      bodyGrad.addColorStop(0.4, '#d4b184');
      bodyGrad.addColorStop(0.75, '#e0c094');
      bodyGrad.addColorStop(1, '#c9a87c');
      ctx.fillStyle = bodyGrad;
      ctx.fill();
      ctx.strokeStyle = '#7a6040';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = '#5a3f22';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      const stripes = [
        [-35, -172, -45, -160],
        [-50, -165, -58, -148],
        [-62, -152, -68, -132],
        [-70, -138, -74, -118],
      ];
      stripes.forEach(([x1,y1,x2,y2]) => {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo((x1+x2)/2 - 5, (y1+y2)/2 - 3, x2, y2);
        ctx.stroke();
      });
      ctx.restore();

      ctx.beginPath();
      ctx.moveTo(-25, -58);
      ctx.bezierCurveTo(-5, -62 - breath, 25, -68 - breath, 42, -82);
      ctx.bezierCurveTo(50, -92, 40, -108, 20, -110);
      ctx.bezierCurveTo(-10, -112, -35, -92, -40, -75);
      ctx.bezierCurveTo(-42, -68, -35, -60, -25, -58);
      ctx.closePath();
      ctx.fillStyle = 'rgba(248, 240, 225, 0.9)';
      ctx.fill();
    }

    function drawCatLeg(jointX, jointY, footX, footY, width, fillColor, strokeColor) {
      const ctx = catCtx;
      ctx.beginPath();
      ctx.arc(jointX, jointY, width * 0.9, 0, Math.PI * 2);
      ctx.fillStyle = fillColor;
      ctx.fill();

      const midX = (jointX + footX) / 2 + 5;
      const midY = (jointY + footY) / 2;

      ctx.beginPath();
      ctx.moveTo(jointX, jointY);
      ctx.quadraticCurveTo(midX - 8, midY, footX, footY - width * 0.4);
      ctx.lineTo(footX + width * 0.7, footY - 2);
      ctx.quadraticCurveTo(footX + width * 0.4, footY + 2, footX - width * 0.5, footY - 1);
      ctx.quadraticCurveTo(midX - 18, midY, jointX - width * 0.5, jointY + width * 0.2);
      ctx.closePath();
      ctx.fillStyle = fillColor;
      ctx.fill();
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(footX + 2, footY - 3, width * 0.55, width * 0.38, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#f0d5c0';
      ctx.fill();
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }

    function drawCatTail(rootX, rootY) {
      const ctx = catCtx;
      const c = catState;
      const swing = c.tailPhase;
      const lift = Math.sin(c.tailPhase * 1.3) * 8;

      ctx.save();
      ctx.translate(rootX, rootY);
      ctx.rotate(-0.3 + swing);

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-35, -15 + lift * 0.5, -65, -45 + lift);
      ctx.quadraticCurveTo(-85, -70 + lift * 1.2, -75, -95 + lift * 1.5);
      ctx.lineWidth = 15;
      ctx.strokeStyle = '#8a6d4b';
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-72, -78 + lift * 1.3);
      ctx.quadraticCurveTo(-80, -88 + lift * 1.5, -75, -98 + lift * 1.6);
      ctx.lineWidth = 12;
      ctx.strokeStyle = '#e8ddcf';
      ctx.stroke();

      ctx.restore();
    }

    function drawCatHead(headX, headY) {
      const ctx = catCtx;
      const c = catState;

      ctx.beginPath();
      ctx.moveTo(0, -168);
      ctx.bezierCurveTo(5, -180, 15, -188, 22, -192);
      ctx.lineTo(38, -190);
      ctx.bezierCurveTo(45, -180, 48, -168, 45, -158);
      ctx.lineTo(10, -160);
      ctx.closePath();
      ctx.fillStyle = '#d4b184';
      ctx.fill();
      ctx.strokeStyle = '#7a6040';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(headX, headY, 42, 38, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#e0c094';
      ctx.fill();
      ctx.strokeStyle = '#7a6040';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(headX - 20, headY + 12, 20, 16, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#e0c094';
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(headX + 20, headY + 12, 20, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = '#5a3f22';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(headX - 20, headY - 28);
      ctx.lineTo(headX - 12, headY - 36);
      ctx.lineTo(headX - 4, headY - 28);
      ctx.lineTo(headX + 4, headY - 36);
      ctx.lineTo(headX + 12, headY - 28);
      ctx.lineTo(headX + 20, headY - 36);
      ctx.stroke();
      ctx.restore();

      const twitch = c.earTwitch;

      ctx.beginPath();
      ctx.moveTo(headX - 30, headY - 22);
      ctx.lineTo(headX - 48, headY - 60 + twitch * 12);
      ctx.lineTo(headX - 8, headY - 38);
      ctx.closePath();
      ctx.fillStyle = '#d4b184';
      ctx.fill();
      ctx.strokeStyle = '#7a6040';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(headX - 28, headY - 26);
      ctx.lineTo(headX - 40, headY - 50 + twitch * 10);
      ctx.lineTo(headX - 16, headY - 34);
      ctx.closePath();
      ctx.fillStyle = '#e8b0a8';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(headX + 8, headY - 38);
      ctx.lineTo(headX + 48, headY - 60 - twitch * 12);
      ctx.lineTo(headX + 30, headY - 22);
      ctx.closePath();
      ctx.fillStyle = '#d4b184';
      ctx.fill();
      ctx.strokeStyle = '#7a6040';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(headX + 16, headY - 34);
      ctx.lineTo(headX + 40, headY - 50 - twitch * 10);
      ctx.lineTo(headX + 28, headY - 26);
      ctx.closePath();
      ctx.fillStyle = '#e8b0a8';
      ctx.fill();

      const eyeY = headY - 2;
      const eyeSpacing = 18;

      if (!c.eyeBlink) {
        ctx.beginPath();
        ctx.ellipse(headX - eyeSpacing, eyeY, 9, 11, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#f8f4ec';
        ctx.fill();
        ctx.strokeStyle = '#3d2e1f';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(headX - eyeSpacing + 1, eyeY + 1, 5, 8, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#7ea860';
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(headX - eyeSpacing + 1, eyeY + 1, 2.2, 6.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#1a1208';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(headX - eyeSpacing - 2, eyeY - 4, 2, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(headX + eyeSpacing, eyeY, 9, 11, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#f8f4ec';
        ctx.fill();
        ctx.strokeStyle = '#3d2e1f';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(headX + eyeSpacing + 1, eyeY + 1, 5, 8, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#7ea860';
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(headX + eyeSpacing + 1, eyeY + 1, 2.2, 6.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#1a1208';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(headX + eyeSpacing - 2, eyeY - 4, 2, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
      } else {
        ctx.strokeStyle = '#3d2e1f';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(headX - eyeSpacing - 8, eyeY);
        ctx.quadraticCurveTo(headX - eyeSpacing, eyeY + 4, headX - eyeSpacing + 8, eyeY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(headX + eyeSpacing - 8, eyeY);
        ctx.quadraticCurveTo(headX + eyeSpacing, eyeY + 4, headX + eyeSpacing + 8, eyeY);
        ctx.stroke();
      }

      const noseY = headY + 12;
      ctx.beginPath();
      ctx.moveTo(headX - 5, noseY);
      ctx.lineTo(headX + 5, noseY);
      ctx.lineTo(headX, noseY + 6);
      ctx.closePath();
      ctx.fillStyle = '#e08a80';
      ctx.fill();
      ctx.strokeStyle = '#a05a50';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.strokeStyle = '#5a4030';
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(headX, noseY + 6);
      ctx.quadraticCurveTo(headX - 7, noseY + 13, headX - 14, noseY + 9);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(headX, noseY + 6);
      ctx.quadraticCurveTo(headX + 7, noseY + 13, headX + 14, noseY + 9);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(240, 235, 225, 0.85)';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 3; i++) {
        const yOff = i * 4;
        ctx.beginPath();
        ctx.moveTo(headX - 22, noseY + 2 + yOff);
        ctx.quadraticCurveTo(headX - 45, noseY - 4 + yOff * 1.4, headX - 62, noseY + yOff * 1.6);
        ctx.stroke();
      }
      for (let i = 0; i < 3; i++) {
        const yOff = i * 4;
        ctx.beginPath();
        ctx.moveTo(headX + 22, noseY + 2 + yOff);
        ctx.quadraticCurveTo(headX + 45, noseY - 4 + yOff * 1.4, headX + 62, noseY + yOff * 1.6);
        ctx.stroke();
      }
    }

    function catLoop() {
      if (!catActive) return;

      updateCat();
      updateHoveringPost();

      // レスの中にいる間は、猫をそのレスの位置に固定
      if (catState.insidePostKey) {
        const el = document.querySelector(`.post-card[data-post-key="${catState.insidePostKey}"]`);
        if (el) {
          const rect = el.getBoundingClientRect();
          catState.x = rect.left + rect.width / 2;
          catState.y = rect.top + rect.height - 40;
        } else {
          // レスが消えたら外に出す
          catState.insidePostKey = null;
          clearPostHighlights();
        }
      }

      drawCatOnCanvas();

      catRaf = requestAnimationFrame(catLoop);
    }

    // ============================================================
    // クリーンアップ
    // ============================================================
    window.addEventListener('beforeunload', () => {
      if (postsUnsubscribe) postsUnsubscribe();
      if (threadsUnsubscribe) threadsUnsubscribe();
      dismissCat();
    });
    window.addEventListener('unhandledrejection', (event) => {
      console.error('未処理のPromiseエラー:', event.reason);
    });
  </script>
</body>
</html>

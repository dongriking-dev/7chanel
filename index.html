<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匿名掲示板 (2ch風)</title>
  <!-- デザイン構築用のTailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 max-w-4xl mx-auto">

  <!-- ヘッダー -->
  <header class="border-b-2 border-red-800 pb-2 mb-4">
    <h1 class="text-3xl font-bold text-red-900">2ch風 匿名掲示板</h1>
    <p class="text-sm text-gray-600">画像・動画・ファイル・URL対応 (デザインUI版)</p>
  </header>

  <!-- 投稿フォーム -->
  <section class="bg-amber-50 border border-amber-200 p-4 rounded mb-6 shadow-sm">
    <h2 class="text-lg font-bold text-gray-700 mb-2">新規書き込み</h2>
    <form id="postForm" class="space-y-3">
      <div class="flex gap-2">
        <input type="text" id="author" placeholder="名前 (空欄で「名無しさん」)" class="border p-2 rounded w-1/3 text-sm">
        <input type="text" id="urlInput" placeholder="関連URL (任意)" class="border p-2 rounded w-2/3 text-sm">
      </div>
      
      <div>
        <textarea id="content" rows="4" placeholder="コメントを入力してください（必須）" class="w-full border p-2 rounded text-sm" required></textarea>
      </div>

      <div class="flex items-center justify-between flex-wrap gap-2">
        <div>
          <label class="block text-xs text-gray-600 mb-1">添付ファイル (画像/動画/その他):</label>
          <input type="file" id="fileInput" class="text-xs text-gray-600">
        </div>
        <button type="submit" id="submitBtn" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-6 rounded text-sm transition">
          書き込む
        </button>
      </div>
    </form>
  </section>

  <!-- 投稿一覧表示エリア -->
  <main>
    <h2 class="text-xl font-bold border-b pb-1 mb-4 text-gray-700">スレッド一覧</h2>
    <div id="postsContainer" class="space-y-4">
      <!-- JavaScriptでここに投稿が自動追加されます -->
    </div>
  </main>

  <!-- JavaScript（画面の擬似動作ロジック） -->
  <script>
    const postForm = document.getElementById('postForm');
    const postsContainer = document.getElementById('postsContainer');

    // 擬似データ（初期表示用）
    let posts = [
      {
        id: 1,
        author: '名無しさん',
        content: 'テスト投稿です。ここに本文が表示されます。\nFirebase接続前にデザインや動作を確認できます。',
        linkUrl: 'https://example.com',
        file: null,
        createdAt: new Date().toLocaleString('ja-JP')
      }
    ];

    // 画面に投稿一覧を描画する関数
    function renderPosts() {
      postsContainer.innerHTML = '';

      if (posts.length === 0) {
        postsContainer.innerHTML = '<p class="text-gray-500 text-sm">投稿がありません。</p>';
        return;
      }

      posts.forEach((post, index) => {
        const postDiv = document.createElement('div');
        postDiv.className = 'bg-white p-3 border border-gray-300 rounded text-sm shadow-sm';

        // 投稿の基本構造（番号、投稿者、日時、本文）
        let html = `
          <div class="font-bold text-gray-700 mb-1">
            <span class="text-red-800">${index + 1}</span> ：
            <span class="text-green-700">${escapeHtml(post.author)}</span>：
            <span class="text-gray-500 text-xs font-normal">${post.createdAt}</span>
          </div>
          <div class="text-gray-900 whitespace-pre-wrap mb-2">${escapeHtml(post.content)}</div>
        `;

        // 関連URLの描画
        if (post.linkUrl) {
          html += `
            <div class="mb-2">
              <span class="text-xs text-gray-500">URL: </span>
              <a href="${escapeHtml(post.linkUrl)}" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline text-xs break-all">
                ${escapeHtml(post.linkUrl)}
              </a>
            </div>
          `;
        }

        // 添付ファイルの描画（画像・動画・ファイルの判定）
        if (post.file) {
          html += `<div class="mt-2 p-2 border border-gray-200 bg-gray-50 rounded">`;
          
          if (post.file.type.startsWith('image/')) {
            html += `<img src="${post.file.url}" class="max-h-64 rounded object-contain mb-1" alt="添付画像">`;
          } else if (post.file.type.startsWith('video/')) {
            html += `<video controls class="max-h-64 rounded w-full max-w-md mb-1"><source src="${post.file.url}" type="${post.file.type}">動画を再生できません。</video>`;
          }

          html += `
            <a href="${post.file.url}" target="_blank" download class="text-xs text-blue-600 underline flex items-center gap-1">
              📎 添付ファイル: ${escapeHtml(post.file.name)}
            </a>
          </div>`;
        }

        postDiv.innerHTML = html;
        postsContainer.appendChild(postDiv);
      });
    }

    // フォーム送信時の処理（画面上での模擬投稿）
    postForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const author = document.getElementById('author').value.trim() || '名無しさん';
      const content = document.getElementById('content').value.trim();
      const urlInput = document.getElementById('urlInput').value.trim();
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!content) return;

      let fileData = null;
      if (file) {
        // ローカルでファイルを一時的に表示するためのURL生成
        fileData = {
          name: file.name,
          type: file.type,
          url: URL.createObjectURL(file)
        };
      }

      // 新しい投稿データを配列に追加
      posts.push({
        id: Date.now(),
        author: author,
        content: content,
        linkUrl: urlInput || null,
        file: fileData,
        createdAt: new Date().toLocaleString('ja-JP')
      });

      // 再描画とフォームリセット
      renderPosts();
      postForm.reset();
    });

    // XSS対策（文字のエスケープ処理）
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
    }

    // 初期表示
    renderPosts();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7ch</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='8' fill='%23d97706'/%3E%3Crect x='8' y='8' width='48' height='48' rx='4' fill='%23f59e0b'/%3E%3Crect x='14' y='18' width='36' height='36' rx='2' fill='%23ffffff' transform='rotate(-4 32 36)'/%3E%3Cpath d='M20 28h24M20 35h24M20 42h16' stroke='%2394a3b8' stroke-width='3' stroke-linecap='round' transform='rotate(-4 32 36)'/%3E%3Ccircle cx='32' cy='14' r='4' fill='%23ef4444'/%3E%3Ccircle cx='31' cy='13' r='1.5' fill='%23fca5a5'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .threads-scroll { max-height: 480px; overflow-y: auto; scrollbar-width: thin; }
    .post-number { font-weight: 700; color: #991b1b; }
    .post-author { color: #15803d; font-weight: 600; }
    .loading-spinner {
      display: inline-block; width: 1rem; height: 1rem;
      border: 2px solid #f3f3f3; border-top: 2px solid #991b1b;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .optimistic-item { opacity: 0.55; pointer-events: none; position: relative; }
    .optimistic-item::after {
      content: "送信中..."; position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%); font-size: 10px; color: #991b1b;
      background: #fef2f2; padding: 2px 6px; border-radius: 4px; border: 1px solid #fecaca;
    }
    .optimistic-post { opacity: 0.6; border-left: 3px solid #f59e0b !important; }
    #statusBanner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      text-align: center; padding: 6px; font-size: 12px;
      transition: transform 0.3s; transform: translateY(-100%);
    }
    #statusBanner.show { transform: translateY(0); }
    .admin-badge {
      background: #7c2d12; color: #fff; font-size: 10px; padding: 2px 6px;
      border-radius: 4px; margin-left: 6px;
    }
    .admin-email {
      background: #fef3c7; color: #92400e; font-size: 11px; padding: 2px 6px;
      border-radius: 4px; font-family: monospace;
    }
    .delete-btn {
      background: #dc2626; color: #fff; font-size: 11px; padding: 3px 10px;
      border-radius: 4px; cursor: pointer; border: none;
    }
    .delete-btn:hover { background: #b91c1c; }
    .delete-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    /* ★ 返信機能用のスタイル */
    .reply-btn {
      background: #2563eb; color: #fff; font-size: 11px; padding: 3px 10px;
      border-radius: 4px; cursor: pointer; border: none;
    }
    .reply-btn:hover { background: #1d4ed8; }
    .reply-cancel-btn {
      background: #6b7280; color: #fff; font-size: 11px; padding: 3px 10px;
      border-radius: 4px; cursor: pointer; border: none;
    }
    .reply-cancel-btn:hover { background: #4b5563; }
    .post-card {
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    /* ネスト（入れ子）用：左に縦線を引く */
    .post-children {
      margin-left: 20px;
      padding-left: 12px;
      border-left: 2px solid #fbbf24;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .post-tree { display: flex; flex-direction: column; gap: 8px; }
    .inline-reply-box {
      margin-top: 8px;
      padding: 10px;
      background: #fffbeb;
      border: 1px dashed #fbbf24;
      border-radius: 6px;
    }
    .inline-reply-box textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 6px;
      font-size: 13px;
      outline: none;
      resize: vertical;
      min-height: 60px;
    }
    .inline-reply-box textarea:focus {
      border-color: #ef4444;
      box-shadow: 0 0 0 2px rgba(239,68,68,0.15);
    }
    .reply-target-label {
      font-size: 11px;
      color: #92400e;
      background: #fef3c7;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 max-w-4xl mx-auto">

  <div id="statusBanner" class="bg-red-600 text-white"></div>

  <!-- ============================================================
       ログイン画面
       ============================================================ -->
  <div id="loginView" class="hidden">
    <div class="bg-white border border-gray-300 rounded-lg shadow p-8 max-w-md mx-auto mt-16 text-center">
      <h1 class="text-3xl font-bold text-red-900 mb-2">7ちゃんねる</h1>
      <p class="text-sm text-gray-600 mb-6">ご利用にはGoogleアカウントでのログインが必要です。</p>
      <p class="text-sm text-gray-600 mb-6">安全のためです。</p>
      <button id="googleLoginBtn"
        class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold py-3 px-6 rounded shadow-sm flex items-center justify-center gap-3 mx-auto transition w-full">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C41.4 35.3 44 30.1 44 24c0-1.3-.1-2.3-.4-3.5z"/>
        </svg>
        Googleでログイン
      </button>
      <p class="text-xs text-gray-400 mt-4">※ 投稿は匿名で表示されます</p>
    </div>
  </div>

  <!-- ============================================================
       メイン画面
       ============================================================ -->
  <div id="mainView" class="hidden">
    <header class="border-b-2 border-red-800 pb-2 mb-4 flex justify-between items-center flex-wrap gap-2">
      <div>
        <h1 class="text-3xl font-bold text-red-900 cursor-pointer" onclick="showThreadList()">7ちゃんねる</h1>
        <p class="text-sm text-gray-600">
          <span id="connDot" class="inline-block w-2 h-2 rounded-full bg-gray-400"></span>
          <span id="connText">接続中...</span>
          <span id="adminBadge" class="admin-badge hidden">管理者</span>
        </p>
      </div>
      <div class="flex items-center gap-2">
        <span id="userEmail" class="text-xs text-gray-500 hidden"></span>
        <button id="logoutBtn" onclick="doLogout()" class="bg-gray-500 hover:bg-gray-600 text-white text-xs py-1.5 px-3 rounded transition shadow">
          ログアウト
        </button>
        <button id="backToListBtn" onclick="showThreadList()" class="hidden bg-gray-600 hover:bg-gray-700 text-white text-xs py-1.5 px-3 rounded transition shadow">
          ← スレッド一覧に戻る
        </button>
      </div>
    </header>

    <!-- View 1: スレッド一覧 -->
    <div id="threadListView">
      <section class="bg-amber-50 border border-amber-200 p-4 rounded mb-6 shadow-sm">
        <h2 class="text-lg font-bold text-gray-700 mb-2">新規スレッド作成</h2>
        <form id="createThreadForm" class="space-y-3">
          <input type="text" id="threadTitle" placeholder="スレッドのタイトルを入力（必須）" maxlength="100" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-red-300 focus:border-red-400 outline-none" required>
          <textarea id="firstPostContent" rows="3" placeholder="最初の書き込み内容（任意）" maxlength="2000" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-red-300 focus:border-red-400 outline-none"></textarea>
          <button type="submit" id="createThreadBtn" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-6 rounded text-sm transition shadow-sm">
            スレッドを立てる
          </button>
        </form>
      </section>

      <main>
        <h2 class="text-xl font-bold border-b pb-1 mb-4 text-gray-700">スレッド一覧</h2>
        <div id="threadsContainer" class="space-y-2 threads-scroll pr-1">
          <p class="text-gray-500 text-sm"><span class="loading-spinner"></span> スレッドを読み込み中...</p>
        </div>
      </main>
    </div>

    <!-- View 2: スレッド詳細 -->
    <div id="threadDetailView" class="hidden">
      <div class="bg-white p-4 border border-gray-300 rounded mb-4 shadow-sm flex justify-between items-start gap-3 flex-wrap">
        <div class="flex-1 min-w-0">
          <h2 id="currentThreadTitle" class="text-2xl font-bold text-red-900 mb-1 break-words"></h2>
          <p id="currentThreadDate" class="text-xs text-gray-500"></p>
          <p id="currentThreadAuthor" class="text-xs text-gray-500 mt-1"></p>
        </div>
        <button id="deleteThreadBtn" class="delete-btn hidden" onclick="deleteCurrentThread()">スレッドを削除</button>
      </div>

      <section class="bg-amber-50 border border-amber-200 p-4 rounded mb-6 shadow-sm">
        <h3 class="text-md font-bold text-gray-700 mb-2">このスレッドに書き込む</h3>
        <form id="postForm" class="space-y-3">
          <textarea id="postContent" rows="4" placeholder="コメントを入力してください。URLは自動でリンク化されます。" maxlength="2000" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-red-300 focus:border-red-400 outline-none" required></textarea>
          <div class="flex justify-end">
            <button type="submit" id="submitBtn" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-6 rounded text-sm transition shadow-sm whitespace-nowrap">
              書き込む
            </button>
          </div>
        </form>
      </section>

      <main>
        <h3 class="text-lg font-bold border-b pb-1 mb-4 text-gray-700">レス一覧</h3>
        <!-- ★ 返信ツリーを描画するコンテナ -->
        <div id="postsContainer" class="post-tree">
          <p class="text-gray-500 text-sm"><span class="loading-spinner"></span> 読み込み中...</p>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    // ============================================================
    // Firebase SDK
    // ============================================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import {
      getDatabase, ref, push, set, remove, onValue, off,
      query, orderByChild, get
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ============================================================
    // Firebase 設定
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBCoiJAnVWIOH9csEPlDyWJgfj6sSlNO2o",
      authDomain: "chaneler-52b95.firebaseapp.com",
      projectId: "chaneler-52b95",
      databaseURL: "https://chaneler-52b95-default-rtdb.firebaseio.com",
      storageBucket: "chaneler-52b95.firebasestorage.app",
      messagingSenderId: "538510918184",
      appId: "1:538510918184:web:58232aa80922ff00b92b1d",
      measurementId: "G-QF3LDMNQYQ"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // ============================================================
    // 管理者設定
    // ============================================================
    const ADMIN_EMAIL = "katou.noel114514@gmail.com";

    // ============================================================
    // グローバル
    // ============================================================
    let currentUser = null;
    let isAdmin = false;
    let currentThreadKey = null;
    let postsUnsubscribe = null;
    let threadsUnsubscribe = null;

    // ★ 現在開いている返信ボックスの親ID（null なら閉じている）
    let activeReplyParentId = null;
    // ★ スレッド内の全レスを保持（番号付け・返信時に参照）
    let allPostsCache = [];
    // ★ レス番号マップ： postKey -> 表示番号
    let postNumberMap = new Map();

    const loginView = document.getElementById('loginView');
    const mainView = document.getElementById('mainView');
    const threadListView = document.getElementById('threadListView');
    const threadDetailView = document.getElementById('threadDetailView');
    const backToListBtn = document.getElementById('backToListBtn');
    const threadsContainer = document.getElementById('threadsContainer');
    const postsContainer = document.getElementById('postsContainer');
    const connDot = document.getElementById('connDot');
    const connText = document.getElementById('connText');
    const statusBanner = document.getElementById('statusBanner');
    const adminBadge = document.getElementById('adminBadge');
    const userEmailSpan = document.getElementById('userEmail');
    let bannerTimer = null;

    // ============================================================
    // 接続状態 & バナー
    // ============================================================
    function setConnection(online) {
      if (online) {
        connDot.className = 'inline-block w-2 h-2 rounded-full bg-green-500';
        connText.textContent = 'オンライン（リアルタイム同期中）';
      } else {
        connDot.className = 'inline-block w-2 h-2 rounded-full bg-red-500';
        connText.textContent = 'オフライン';
      }
    }
    function showBanner(msg, isError = true) {
      statusBanner.textContent = msg;
      statusBanner.className = (isError ? 'bg-red-600' : 'bg-green-600') + ' text-white show';
      statusBanner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;text-align:center;padding:6px;font-size:12px;transform:translateY(0);';
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => {
        statusBanner.style.transform = 'translateY(-100%)';
      }, 4000);
    }
    window.addEventListener('online', () => setConnection(true));
    window.addEventListener('offline', () => setConnection(false));

    // ============================================================
    // ユーティリティ
    // ============================================================
    function formatContent(str) {
      if (!str) return '';
      const escaped = escapeHtml(str);
      const urlRegex = /(https?:\/\/[^\s<]+)/g;
      return escaped.replace(urlRegex, (url) =>
        `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline break-all">${url}</a>`);
    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function showMainView() {
      loginView.classList.add('hidden');
      mainView.classList.remove('hidden');
    }
    function showLoginView() {
      loginView.classList.add('hidden');
      mainView.classList.remove('hidden');
    }

    // ============================================================
    // 認証フロー
    // ============================================================
    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error("ログインエラー:", err);
        if (err.code !== 'auth/popup-closed-by-user') {
          alert("ログインに失敗しました: " + (err.message || ''));
        }
      }
    });

    window.doLogout = async function() {
      if (postsUnsubscribe) { postsUnsubscribe(); postsUnsubscribe = null; }
      if (threadsUnsubscribe) { threadsUnsubscribe(); threadsUnsubscribe = null; }
      try { await signOut(auth); } catch (e) { console.error(e); }
    };

    onAuthStateChanged(auth, (user) => {
      currentUser = user;

      if (!user) {
        isAdmin = false;
        showLoginView();
        return;
      }

      isAdmin = (user.email === ADMIN_EMAIL);

      if (isAdmin) {
        adminBadge.classList.remove('hidden');
        userEmailSpan.classList.remove('hidden');
        userEmailSpan.textContent = user.email + '（管理者）';
        userEmailSpan.className = 'text-xs text-red-700 font-bold';
      } else {
        adminBadge.classList.add('hidden');
        userEmailSpan.classList.add('hidden');
        userEmailSpan.textContent = '';
      }

      showMainView();
      setConnection(navigator.onLine);

      showThreadList();
      initThreadsListener();
    });

    // ============================================================
    // 画面切り替え
    // ============================================================
    window.showThreadList = function() {
      threadListView.classList.remove('hidden');
      threadDetailView.classList.add('hidden');
      backToListBtn.classList.add('hidden');
      currentThreadKey = null;
      activeReplyParentId = null;
      if (postsUnsubscribe) { postsUnsubscribe(); postsUnsubscribe = null; }
      postsContainer.innerHTML = '<p class="text-gray-500 text-sm">読み込み中...</p>';
    };

    function openThread(threadKey, title, createdAt, authorEmail) {
      currentThreadKey = threadKey;
      activeReplyParentId = null;
      document.getElementById('currentThreadTitle').innerText = title;
      document.getElementById('currentThreadDate').innerText = '作成日時: ' + createdAt;

      const authorEl = document.getElementById('currentThreadAuthor');
      const delBtn = document.getElementById('deleteThreadBtn');
      if (isAdmin) {
        authorEl.textContent = '作成者: ' + (authorEmail || '不明');
        authorEl.className = 'text-xs text-red-700 font-bold mt-1';
        delBtn.classList.remove('hidden');
      } else {
        authorEl.textContent = '';
        delBtn.classList.add('hidden');
      }

      threadListView.classList.add('hidden');
      threadDetailView.classList.remove('hidden');
      backToListBtn.classList.remove('hidden');

      loadPosts(threadKey);
    }

    // ============================================================
    // 1. スレッド作成
    // ============================================================
    document.getElementById('createThreadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) { alert('ログインが必要です。'); return; }

      const title = document.getElementById('threadTitle').value.trim();
      const content = document.getElementById('firstPostContent').value.trim();
      const btn = document.getElementById('createThreadBtn');

      if (!title) { alert('スレッドタイトルを入力してください。'); return; }

      btn.disabled = true;
      btn.innerText = '作成中...';

      const tempKey = 'temp_' + Date.now();
      const tempItem = document.createElement('div');
      tempItem.id = 'optimistic_thread_' + tempKey;
      tempItem.className = 'bg-white p-3 border border-gray-300 rounded flex justify-between items-center shadow-sm optimistic-item';
      tempItem.innerHTML = `
        <div class="flex-1 min-w-0">
          <span class="font-bold text-blue-900 break-words">${escapeHtml(title)}</span>
          <span class="text-xs text-gray-400 ml-2 whitespace-nowrap">(送信中...)</span>
        </div>`;
      threadsContainer.prepend(tempItem);

      document.getElementById('createThreadForm').reset();

      try {
        const threadsRef = ref(db, 'threads');
        const newThreadRef = push(threadsRef);
        const threadKey = newThreadRef.key;

        const threadData = {
          title: title,
          createdAt: Date.now(),
          postCount: content ? 1 : 0,
          authorEmail: currentUser.email,
          authorUid: currentUser.uid
        };

        const writes = [set(newThreadRef, threadData)];

        if (content) {
          const postRef = push(ref(db, `threads/${threadKey}/posts`));
          writes.push(set(postRef, {
            author: '名無しさん',
            content: content,
            createdAt: Date.now(),
            authorEmail: currentUser.email,
            authorUid: currentUser.uid,
            parentId: null   // ★ トップレベル
          }));
        }

        await Promise.all(writes);
        showBanner('スレッドを保存しました', false);
        const tempEl = document.getElementById('optimistic_thread_' + tempKey);
        if (tempEl) tempEl.remove();
      } catch (err) {
        console.error("スレッド作成エラー:", err);
        const el = document.getElementById('optimistic_thread_' + tempKey);
        if (el) el.remove();
        showBanner('保存失敗: ' + (err.code || err.message || 'ネットワークエラー'), true);
        alert("スレッドの作成に失敗しました。\n" + (err.message || ''));
      } finally {
        btn.disabled = false;
        btn.innerText = 'スレッドを立てる';
      }
    });

    // ============================================================
    // 2. スレッド一覧 リアルタイム監視
    // ============================================================
    function initThreadsListener() {
      if (threadsUnsubscribe) threadsUnsubscribe();

      const threadsRef = ref(db, 'threads');
      const q = query(threadsRef, orderByChild('createdAt'));

      threadsUnsubscribe = onValue(q, (snapshot) => {
        setConnection(true);
        threadsContainer.innerHTML = '';

        if (!snapshot.exists()) {
          threadsContainer.innerHTML = '<p class="text-gray-500 text-sm">スレッドがありません。新しく作成してください。</p>';
          return;
        }

        const threads = [];
        snapshot.forEach((child) => {
          threads.push({ key: child.key, ...child.val() });
        });
        threads.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        threads.forEach((thread) => {
          let date = '日時不明';
          if (thread.createdAt) {
            try { date = new Date(thread.createdAt).toLocaleString('ja-JP'); }
            catch (e) { date = '日時不明'; }
          }

          const item = document.createElement('div');
          item.className = 'bg-white p-3 border border-gray-300 rounded hover:bg-amber-50 cursor-pointer transition flex justify-between items-center shadow-sm';
          item.onclick = () => openThread(thread.key, thread.title, date, thread.authorEmail);
          item.innerHTML = `
            <div class="flex-1 min-w-0">
              <span class="font-bold text-blue-900 break-words">${escapeHtml(thread.title)}</span>
              <span class="text-xs text-gray-400 ml-2 whitespace-nowrap">(${date})</span>
            </div>
            <span class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded-full ml-2 whitespace-nowrap">開く</span>`;
          threadsContainer.appendChild(item);
        });
      }, (error) => {
        console.error("スレッド一覧の取得エラー:", error);
        setConnection(false);
        threadsContainer.innerHTML =
          '<p class="text-red-500 text-sm">スレッド一覧の読み込みに失敗しました。<br>' +
          'Realtime Database のルールを確認してください。</p>';
        showBanner('読み込み失敗: ' + (error.code || error.message), true);
      });
    }

    // ============================================================
    // ★ 3. レス読み込み（ツリー構築に変更）
    // ============================================================
    function loadPosts(threadKey) {
      if (postsUnsubscribe) { postsUnsubscribe(); postsUnsubscribe = null; }
      postsContainer.innerHTML = '<p class="text-gray-500 text-sm"><span class="loading-spinner"></span> 読み込み中...</p>';

      const postsRef = ref(db, `threads/${threadKey}/posts`);
      const q = query(postsRef, orderByChild('createdAt'));

      postsUnsubscribe = onValue(q, (snapshot) => {
        setConnection(true);
        postsContainer.innerHTML = '';

        if (!snapshot.exists()) {
          allPostsCache = [];
          postNumberMap = new Map();
          postsContainer.innerHTML = '<p class="text-gray-500 text-sm">まだ書き込みがありません。</p>';
          return;
        }

        // --- 全レスを配列化 ---
        const posts = [];
        snapshot.forEach((child) => {
          posts.push({ key: child.key, ...child.val() });
        });

        // 時系列順（古い→新しい）
        posts.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        allPostsCache = posts;

        // --- 通し番号を付与（すべてのレスに 1,2,3... と振る） ---
        postNumberMap = new Map();
        posts.forEach((p, i) => {
          postNumberMap.set(p.key, i + 1);
        });

        // --- 親子関係を構築 ---
        const childrenMap = new Map(); // parentId -> 子レス配列
        const rootPosts = [];          // parentId が null or 存在しない親を指すもの
        const keySet = new Set(posts.map(p => p.key));

        posts.forEach((p) => {
          let pid = p.parentId || null;
          // 親が既に削除されている場合はトップレベル扱い
          if (pid && !keySet.has(pid)) pid = null;

          if (pid === null) {
            rootPosts.push(p);
          } else {
            if (!childrenMap.has(pid)) childrenMap.set(pid, []);
            childrenMap.get(pid).push(p);
          }
        });

        // --- 再帰的にツリーを描画 ---
        const frag = document.createDocumentFragment();
        rootPosts.forEach((p) => {
          frag.appendChild(renderPostTree(p, childrenMap));
        });
        postsContainer.appendChild(frag);

        // もし activeReplyParentId がまだ生きているなら、その返信ボックスを再展開
        if (activeReplyParentId && keySet.has(activeReplyParentId)) {
          openReplyBox(activeReplyParentId);
        } else {
          activeReplyParentId = null;
        }
      }, (error) => {
        console.error("レス読み込みエラー:", error);
        setConnection(false);
        postsContainer.innerHTML = '<p class="text-red-500 text-sm">レス一覧の読み込みに失敗しました。</p>';
        showBanner('レス読み込み失敗: ' + (error.code || error.message), true);
      });
    }

    // ★ 再帰的に1つのレス＋その子レスたちを描画
    function renderPostTree(post, childrenMap) {
      const wrap = document.createElement('div');
      wrap.className = 'post-tree';
      wrap.dataset.postKey = post.key;

      const number = postNumberMap.get(post.key) || '?';
      let date = '送信中...';
      if (post.createdAt) {
        try { date = new Date(post.createdAt).toLocaleString('ja-JP'); }
        catch (e) { date = '日時不明'; }
      }

      let adminInfo = '';
      if (isAdmin) {
        adminInfo = `<span class="admin-email">${escapeHtml(post.authorEmail || 'メール不明')}</span>`;
      }

      // ★ 返信先ラベル（親がいる場合、その番号を表示）
      let replyLabel = '';
      if (post.parentId && postNumberMap.has(post.parentId)) {
        const parentNum = postNumberMap.get(post.parentId);
        replyLabel = `<span class="reply-target-label">↩ >>${parentNum}</span>`;
      }

      const postDiv = document.createElement('div');
      postDiv.className = 'post-card';
      postDiv.innerHTML = `
        <div class="font-bold text-gray-700 mb-1 flex flex-wrap items-baseline gap-x-1 items-center">
          <span class="post-number">${number}</span>
          <span>：</span>
          <span class="post-author">${escapeHtml(post.author || '名無しさん')}</span>
          <span>：</span>
          <span class="text-gray-500 text-xs font-normal">${date}</span>
          ${adminInfo}
          <span class="ml-auto flex gap-1">
            <button class="reply-btn" data-reply-key="${post.key}">返信</button>
            ${isAdmin ? `<button class="delete-btn" data-post-key="${post.key}">削除</button>` : ''}
          </span>
        </div>
        <div class="text-gray-900 whitespace-pre-wrap mb-1 break-words">${formatContent(post.content)}</div>
        ${replyLabel ? `<div class="mt-1">${replyLabel}</div>` : ''}
      `;

      // 返信ボタン
      const rbtn = postDiv.querySelector('.reply-btn');
      if (rbtn) {
        rbtn.addEventListener('click', () => onReplyClick(post.key));
      }
      // 削除ボタン（管理者）
      if (isAdmin) {
        const dbtn = postDiv.querySelector('.delete-btn');
        if (dbtn) {
          dbtn.addEventListener('click', () => deletePost(currentThreadKey, post.key, postNumberMap.get(post.key)));
        }
      }

      wrap.appendChild(postDiv);

      // 子レス
      const children = childrenMap.get(post.key) || [];
      if (children.length > 0) {
        const childWrap = document.createElement('div');
        childWrap.className = 'post-children';
        children.forEach((c) => {
          childWrap.appendChild(renderPostTree(c, childrenMap));
        });
        wrap.appendChild(childWrap);
      }

      return wrap;
    }

    // ★ 返信ボタンが押された時
    function onReplyClick(parentId) {
      if (!currentUser) { alert('ログインが必要です。'); return; }
      // 同じ親なら閉じる（トグル）
      if (activeReplyParentId === parentId) {
        closeReplyBox();
        return;
      }
      activeReplyParentId = parentId;
      openReplyBox(parentId);
    }

    // ★ 指定したレスの直下に返信入力ボックスを開く
    function openReplyBox(parentId) {
      // 既存の返信ボックスをすべて除去
      document.querySelectorAll('.inline-reply-box').forEach(el => el.remove());

      const targetWrap = postsContainer.querySelector(`.post-tree[data-post-key="${parentId}"]`);
      if (!targetWrap) return;

      const targetCard = targetWrap.querySelector('.post-card');
      if (!targetCard) return;

      // 親の番号
      const parentNum = postNumberMap.get(parentId) || '?';

      const box = document.createElement('div');
      box.className = 'inline-reply-box';
      box.innerHTML = `
        <div class="reply-target-label">>>${parentNum} への返信</div>
        <textarea class="reply-textarea" placeholder="返信を入力（最大2000文字）" maxlength="2000"></textarea>
        <div class="flex justify-end gap-2 mt-2">
          <button class="reply-cancel-btn">キャンセル</button>
          <button class="reply-send-btn bg-red-800 hover:bg-red-900 text-white text-xs py-1.5 px-4 rounded">返信する</button>
        </div>
      `;

      // カードの直後（子レス群の手前）に挿入
      targetCard.insertAdjacentElement('afterend', box);

      const ta = box.querySelector('.reply-textarea');
      const cancelBtn = box.querySelector('.reply-cancel-btn');
      const sendBtn = box.querySelector('.reply-send-btn');

      cancelBtn.addEventListener('click', () => {
        activeReplyParentId = null;
        box.remove();
      });

      sendBtn.addEventListener('click', async () => {
        const content = ta.value.trim();
        if (!content) { alert('返信内容を入力してください。'); return; }
        sendBtn.disabled = true;
        sendBtn.textContent = '送信中...';
        try {
          await submitReply(parentId, content);
          activeReplyParentId = null;
          box.remove();
        } catch (err) {
          sendBtn.disabled = false;
          sendBtn.textContent = '返信する';
        }
      });

      // Ctrl+Enter でも送信
      ta.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          sendBtn.click();
        }
      });

      ta.focus();
    }

    function closeReplyBox() {
      activeReplyParentId = null;
      document.querySelectorAll('.inline-reply-box').forEach(el => el.remove());
    }

    // ★ 返信を保存
    async function submitReply(parentId, content) {
      if (!currentUser) throw new Error('ログインが必要です');
      if (!currentThreadKey) throw new Error('スレッドが選択されていません');

      const postsRef = ref(db, `threads/${currentThreadKey}/posts`);
      const newPostRef = push(postsRef);
      await set(newPostRef, {
        author: '名無しさん',
        content: content,
        createdAt: Date.now(),
        authorEmail: currentUser.email,
        authorUid: currentUser.uid,
        parentId: parentId  // ★ 親レスを指定
      });
      showBanner('返信を保存しました', false);
    }

    // ============================================================
    // 4. レス投稿（トップレベル）
    // ============================================================
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) { alert('ログインが必要です。'); return; }
      if (!currentThreadKey) { alert('スレッドが選択されていません。'); return; }

      const content = document.getElementById('postContent').value.trim();
      const submitBtn = document.getElementById('submitBtn');

      if (!content) { alert('コメントを入力してください。'); return; }

      const originalText = submitBtn.innerText;
      submitBtn.disabled = true;
      submitBtn.innerText = '送信中...';

      const tempId = 'optimistic_post_' + Date.now();
      const tempPost = document.createElement('div');
      tempPost.id = tempId;
      tempPost.className = 'post-card optimistic-post';
      const optimisticIndex = allPostsCache.length + 1;
      tempPost.innerHTML = `
        <div class="font-bold text-gray-700 mb-1 flex flex-wrap items-baseline gap-x-1">
          <span class="post-number">${optimisticIndex}</span>
          <span>：</span>
          <span class="post-author">名無しさん</span>
          <span>：</span>
          <span class="text-gray-500 text-xs font-normal">送信中...</span>
        </div>
        <div class="text-gray-900 whitespace-pre-wrap mb-2 break-words">${formatContent(content)}</div>`;
      postsContainer.appendChild(tempPost);
      tempPost.scrollIntoView({ behavior: 'smooth', block: 'end' });

      document.getElementById('postForm').reset();

      try {
        const postsRef = ref(db, `threads/${currentThreadKey}/posts`);
        const newPostRef = push(postsRef);
        await set(newPostRef, {
          author: '名無しさん',
          content: content,
          createdAt: Date.now(),
          authorEmail: currentUser.email,
          authorUid: currentUser.uid,
          parentId: null   // ★ トップレベル
        });

        showBanner('書き込みを保存しました', false);
        const el = document.getElementById(tempId);
        if (el) el.remove();
      } catch (error) {
        console.error("投稿エラー:", error);
        const el = document.getElementById(tempId);
        if (el) el.remove();
        showBanner('保存失敗: ' + (error.code || error.message || ''), true);
        alert(`書き込みに失敗しました: ${error.message || '不明なエラー'}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
      }
    });

    // ============================================================
    // 5. 管理者用：レス削除
    // ============================================================
    window.deletePost = async function(threadKey, postKey, index) {
      if (!isAdmin) { alert('管理者のみ削除できます。'); return; }

      // 子レスがあるかチェック
      const hasChildren = allPostsCache.some(p => p.parentId === postKey);
      const msg = hasChildren
        ? `レス #${index} を削除しますか？\n※ このレスへの返信もすべて削除されます。\nこの操作は取り消せません。`
        : `レス #${index} を削除しますか？\nこの操作は取り消せません。`;
      if (!confirm(msg)) return;

      try {
        // ★ 子レスも再帰的に削除
        const toDelete = collectDescendants(postKey);
        toDelete.push(postKey);

        for (const key of toDelete) {
          await remove(ref(db, `threads/${threadKey}/posts/${key}`));
        }

        showBanner('レスを削除しました', false);
      } catch (err) {
        console.error("削除エラー:", err);
        showBanner('削除失敗: ' + (err.code || err.message), true);
        alert('削除に失敗しました。');
      }
    };

    // ★ 子孫レスを全部集める
    function collectDescendants(parentKey) {
      const result = [];
      const stack = [parentKey];
      while (stack.length) {
        const cur = stack.pop();
        allPostsCache.forEach(p => {
          if (p.parentId === cur) {
            result.push(p.key);
            stack.push(p.key);
          }
        });
      }
      return result;
    }

    // ============================================================
    // 6. 管理者用：スレッド削除
    // ============================================================
    window.deleteCurrentThread = async function() {
      if (!isAdmin) { alert('管理者のみ削除できます。'); return; }
      if (!currentThreadKey) return;
      if (!confirm('このスレッドをすべてのレスごと削除しますか？\nこの操作は取り消せません。')) return;

      const key = currentThreadKey;
      try {
        await remove(ref(db, `threads/${key}`));
        showBanner('スレッドを削除しました', false);
        showThreadList();
      } catch (err) {
        console.error("スレッド削除エラー:", err);
        showBanner('削除失敗: ' + (err.code || err.message), true);
        alert('削除に失敗しました。');
      }
    };

    // ============================================================
    // クリーンアップ
    // ============================================================
    window.addEventListener('beforeunload', () => {
      if (postsUnsubscribe) postsUnsubscribe();
      if (threadsUnsubscribe) threadsUnsubscribe();
    });
    window.addEventListener('unhandledrejection', (event) => {
      console.error('未処理のPromiseエラー:', event.reason);
    });
  </script>
</body>
</html>

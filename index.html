<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7ちゃんねる</title>
  <!-- TailWind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .post-content img, .post-content video {
      max-width: 100%;
      height: auto;
    }
    .threads-scroll {
      max-height: 480px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .post-number { font-weight: 700; color: #991b1b; }
    .post-author { color: #15803d; font-weight: 600; }
    input[type="file"]::file-selector-button {
      background-color: #e5e7eb;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      margin-right: 0.5rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    input[type="file"]::file-selector-button:hover { background-color: #d1d5db; }
    .loading-spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #991b1b;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 max-w-4xl mx-auto">

  <!-- ヘッダー -->
  <header class="border-b-2 border-red-800 pb-2 mb-4 flex justify-between items-center flex-wrap gap-2">
    <div>
      <h1 class="text-3xl font-bold text-red-900 cursor-pointer" onclick="showThreadList()">7ちゃんねる</h1>
      <p class="text-sm text-gray-600">ネット掲示板</p>
    </div>
    <button id="backToListBtn" onclick="showThreadList()" class="hidden bg-gray-600 hover:bg-gray-700 text-white text-xs py-1.5 px-3 rounded transition shadow">
      ← スレッド一覧に戻る
    </button>
  </header>

  <!-- ================= View 1: スレッド一覧画面 ================= -->
  <div id="threadListView">
    <!-- 新規スレッド作成フォーム -->
    <section class="bg-amber-50 border border-amber-200 p-4 rounded mb-6 shadow-sm">
      <h2 class="text-lg font-bold text-gray-700 mb-2">新規スレッド作成</h2>
      <form id="createThreadForm" class="space-y-3">
        <input type="text" id="threadTitle" placeholder="スレッドのタイトルを入力（必須）" maxlength="100" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-red-300 focus:border-red-400 outline-none" required>
        <textarea id="firstPostContent" rows="3" placeholder="最初の書き込み内容（任意）" maxlength="2000" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-red-300 focus:border-red-400 outline-none"></textarea>
        <button type="submit" id="createThreadBtn" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-6 rounded text-sm transition shadow-sm">
          スレッドを立てる
        </button>
      </form>
    </section>

    <!-- スレッド一覧 -->
    <main>
      <h2 class="text-xl font-bold border-b pb-1 mb-4 text-gray-700">スレッド一覧</h2>
      <div id="threadsContainer" class="space-y-2 threads-scroll pr-1">
        <p class="text-gray-500 text-sm"><span class="loading-spinner"></span> スレッドを読み込み中...</p>
      </div>
    </main>
  </div>

  <!-- ================= View 2: スレッド詳細（書き込み）画面 ================= -->
  <div id="threadDetailView" class="hidden">
    <div class="bg-white p-4 border border-gray-300 rounded mb-4 shadow-sm">
      <h2 id="currentThreadTitle" class="text-2xl font-bold text-red-900 mb-1 break-words"></h2>
      <p id="currentThreadDate" class="text-xs text-gray-500"></p>
    </div>

    <!-- 返信投稿フォーム -->
    <section class="bg-amber-50 border border-amber-200 p-4 rounded mb-6 shadow-sm">
      <h3 class="text-md font-bold text-gray-700 mb-2">このスレッドに書き込む</h3>
      <form id="postForm" class="space-y-3">
        <textarea id="postContent" rows="4" placeholder="コメントを入力してください。URLは自動でリンク化されます。" maxlength="2000" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-red-300 focus:border-red-400 outline-none" required></textarea>
        <div class="flex items-center justify-between flex-wrap gap-3">
          <div class="flex-1 min-w-[200px]">
            <label class="block text-xs text-gray-600 mb-1">添付ファイル (画像/動画/その他、最大10MB):</label>
            <input type="file" id="fileInput" accept="image/*,video/*,application/pdf,text/plain" class="text-xs text-gray-600 w-full file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-gray-200 file:text-gray-700 hover:file:bg-gray-300">
          </div>
          <button type="submit" id="submitBtn" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-6 rounded text-sm transition shadow-sm whitespace-nowrap">
            書き込む
          </button>
        </div>
        <p class="text-[10px] text-gray-400 mt-1">※ 大きなファイルはアップロードに時間がかかる場合があります</p>
      </form>
    </section>

    <!-- レス一覧 -->
    <main>
      <h3 class="text-lg font-bold border-b pb-1 mb-4 text-gray-700">レス一覧</h3>
      <div id="postsContainer" class="space-y-4">
        <p class="text-gray-500 text-sm"><span class="loading-spinner"></span> 読み込み中...</p>
      </div>
    </main>
  </div>

  <!-- ============================================================
       JavaScript ロジック (Firebase Modular SDK v10.8.0 使用)
  ============================================================ -->
  <script type="module">
    // ============================================================
    // Firebase SDK (Modular) のインポート
    // ============================================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // ============================================================
    // Firebase 設定
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBCoiJAnVWIOH9csEPlDyWJgfj6sSlNO2o",
      authDomain: "chaneler-52b95.firebaseapp.com",
      projectId: "chaneler-52b95",
      storageBucket: "chaneler-52b95.firebasestorage.app",
      messagingSenderId: "538510918184",
      appId: "1:538510918184:web:58232aa80922ff00b92b1d",
      measurementId: "G-QF3LDMNQYQ"
    };

    // ============================================================
    // Firebase 初期化
    // ============================================================
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // ============================================================
    // グローバル変数
    // ============================================================
    let currentThreadId = null;
    let postsUnsubscribe = null;
    let threadsUnsubscribe = null;

    // DOM 要素
    const threadListView = document.getElementById('threadListView');
    const threadDetailView = document.getElementById('threadDetailView');
    const backToListBtn = document.getElementById('backToListBtn');
    const threadsContainer = document.getElementById('threadsContainer');
    const postsContainer = document.getElementById('postsContainer');

    // ============================================================
    // 画面切り替え
    // ============================================================
    window.showThreadList = function() {
      threadListView.classList.remove('hidden');
      threadDetailView.classList.add('hidden');
      backToListBtn.classList.add('hidden');
      currentThreadId = null;
      if (postsUnsubscribe) {
        postsUnsubscribe();
        postsUnsubscribe = null;
      }
      postsContainer.innerHTML = '<p class="text-gray-500 text-sm">読み込み中...</p>';
    };

    function openThread(threadId, title, createdAt) {
      currentThreadId = threadId;
      document.getElementById('currentThreadTitle').innerText = title;
      document.getElementById('currentThreadDate').innerText = '作成日時: ' + createdAt;

      threadListView.classList.add('hidden');
      threadDetailView.classList.remove('hidden');
      backToListBtn.classList.remove('hidden');

      loadPosts(threadId);
    }

    // ============================================================
    // 2. スレッド作成処理
    // ============================================================
    document.getElementById('createThreadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('threadTitle').value.trim();
      const content = document.getElementById('firstPostContent').value.trim();
      const btn = document.getElementById('createThreadBtn');

      if (!title) {
        alert('スレッドタイトルを入力してください。');
        return;
      }

      btn.disabled = true;
      btn.innerText = '作成中...';

      try {
        // スレッドドキュメントを作成（postCount は初期値0、書き込みがあれば+1）
        const threadRef = await addDoc(collection(db, 'threads'), {
          title: title,
          createdAt: serverTimestamp(),
          postCount: content ? 1 : 0
        });

        // 最初の書き込みがあれば追加
        if (content) {
          await addDoc(collection(db, 'threads', threadRef.id, 'posts'), {
            author: '名無しさん',
            content: content,
            file: null,
            createdAt: serverTimestamp()
          });
        }

        document.getElementById('createThreadForm').reset();
      } catch (err) {
        console.error("スレッド作成エラー:", err);
        alert("スレッドの作成に失敗しました。もう一度お試しください。");
      } finally {
        btn.disabled = false;
        btn.innerText = 'スレッドを立てる';
      }
    });

    // ============================================================
    // 3. スレッド一覧のリアルタイム読み込み
    // ============================================================
    function initThreadsListener() {
      if (threadsUnsubscribe) threadsUnsubscribe();

      const q = query(collection(db, 'threads'), orderBy('createdAt', 'desc'));
      threadsUnsubscribe = onSnapshot(q, (snapshot) => {
        threadsContainer.innerHTML = '';

        if (snapshot.empty) {
          threadsContainer.innerHTML = '<p class="text-gray-500 text-sm">スレッドがありません。新しく作成してください。</p>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const thread = docSnap.data();
          let date = '作成中...';
          if (thread.createdAt) {
            try {
              date = new Date(thread.createdAt.toDate()).toLocaleString('ja-JP');
            } catch (e) {
              date = '日時不明';
            }
          }

          const item = document.createElement('div');
          item.className = 'bg-white p-3 border border-gray-300 rounded hover:bg-amber-50 cursor-pointer transition flex justify-between items-center shadow-sm';
          item.onclick = () => openThread(docSnap.id, thread.title, date);

          item.innerHTML = `
            <div class="flex-1 min-w-0">
              <span class="font-bold text-blue-900 break-words">${escapeHtml(thread.title)}</span>
              <span class="text-xs text-gray-400 ml-2 whitespace-nowrap">(${date})</span>
            </div>
            <span class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded-full ml-2 whitespace-nowrap">開く</span>
          `;
          threadsContainer.appendChild(item);
        });
      }, (error) => {
        console.error("スレッド一覧の取得エラー:", error);
        threadsContainer.innerHTML = '<p class="text-red-500 text-sm">スレッド一覧の読み込みに失敗しました。権限またはネットワークを確認してください。</p>';
      });
    }

    // ============================================================
    // 4. 特定スレッド内の書き込み（レス）読み込み
    // ============================================================
    function loadPosts(threadId) {
      if (postsUnsubscribe) {
        postsUnsubscribe();
        postsUnsubscribe = null;
      }
      postsContainer.innerHTML = '<p class="text-gray-500 text-sm"><span class="loading-spinner"></span> 読み込み中...</p>';

      const q = query(
        collection(db, 'threads', threadId, 'posts'),
        orderBy('createdAt', 'asc')
      );

      postsUnsubscribe = onSnapshot(q, (snapshot) => {
        postsContainer.innerHTML = '';

        if (snapshot.empty) {
          postsContainer.innerHTML = '<p class="text-gray-500 text-sm">まだ書き込みがありません。</p>';
          return;
        }

        let index = 1;
        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          let date = '送信中...';
          if (post.createdAt) {
            try {
              date = new Date(post.createdAt.toDate()).toLocaleString('ja-JP');
            } catch (e) {
              date = '日時不明';
            }
          }

          const postDiv = document.createElement('div');
          postDiv.className = 'bg-white p-3 border border-gray-300 rounded text-sm shadow-sm';

          let html = `
            <div class="font-bold text-gray-700 mb-1 flex flex-wrap items-baseline gap-x-1">
              <span class="post-number">${index}</span>
              <span>：</span>
              <span class="post-author">${escapeHtml(post.author || '名無しさん')}</span>
              <span>：</span>
              <span class="text-gray-500 text-xs font-normal">${date}</span>
            </div>
            <div class="text-gray-900 whitespace-pre-wrap mb-2 break-words">${formatContent(post.content)}</div>
          `;

          if (post.file && post.file.url) {
            const file = post.file;
            const fileType = file.type || '';
            const fileName = file.name || '添付ファイル';
            const fileUrl = file.url;

            html += `<div class="mt-2 p-2 border border-gray-200 bg-gray-50 rounded">`;

            if (fileType.startsWith('image/')) {
              html += `<a href="${fileUrl}" target="_blank" rel="noopener noreferrer"><img src="${fileUrl}" class="max-h-64 rounded object-contain mb-1 border" alt="添付画像" loading="lazy"></a>`;
            } else if (fileType.startsWith('video/')) {
              html += `<video controls class="max-h-64 rounded w-full max-w-md mb-1 border" preload="metadata"><source src="${fileUrl}" type="${fileType}">お使いのブラウザは動画タグをサポートしていません。</video>`;
            }

            html += `<a href="${fileUrl}" target="_blank" rel="noopener noreferrer" download class="text-xs text-blue-600 underline break-all flex items-center gap-1">📎 ${escapeHtml(fileName)}</a>`;
            html += `</div>`;
          }

          postDiv.innerHTML = html;
          postsContainer.appendChild(postDiv);
          index++;
        });
      }, (error) => {
        console.error("レス読み込みエラー:", error);
        postsContainer.innerHTML = '<p class="text-red-500 text-sm">レス一覧の読み込みに失敗しました。</p>';
      });
    }

    // ============================================================
    // 5. 返信（レス）書き込み処理
    // ============================================================
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentThreadId) {
        alert('スレッドが選択されていません。');
        return;
      }

      const content = document.getElementById('postContent').value.trim();
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      const submitBtn = document.getElementById('submitBtn');

      if (!content) {
        alert('コメントを入力してください。');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = '送信中...';

      try {
        let fileData = null;
        if (file) {
          const MAX_SIZE = 10 * 1024 * 1024; // 10MB
          if (file.size > MAX_SIZE) {
            throw new Error(`ファイルサイズが大きすぎます（最大 ${MAX_SIZE / 1024 / 1024}MB）`);
          }

          // 安全なファイル名に変換
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          const storageRef = ref(storage, `uploads/${Date.now()}_${safeName}`);
          const snapshot = await uploadBytes(storageRef, file);
          const downloadURL = await getDownloadURL(snapshot.ref);

          fileData = {
            url: downloadURL,
            name: file.name,
            type: file.type || 'application/octet-stream'
          };
        }

        // レスを追加
        await addDoc(collection(db, 'threads', currentThreadId, 'posts'), {
          author: '名無しさん',
          content: content,
          file: fileData,
          createdAt: serverTimestamp()
        });

        // スレッドの postCount をインクリメント
        const threadRef = doc(db, 'threads', currentThreadId);
        const threadSnap = await getDoc(threadRef);
        if (threadSnap.exists()) {
          const currentCount = threadSnap.data().postCount || 0;
          await setDoc(threadRef, { postCount: currentCount + 1 }, { merge: true });
        }

        document.getElementById('postForm').reset();
        fileInput.value = '';
      } catch (error) {
        console.error("投稿エラー:", error);
        alert(`書き込みに失敗しました: ${error.message || '不明なエラー'}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '書き込む';
      }
    });

    // ============================================================
    // ユーティリティ: XSS対策 & URLリンク化
    // ============================================================
    function formatContent(str) {
      if (!str) return '';
      let escaped = escapeHtml(str);
      const urlRegex = /(https?:\/\/[^\s<]+)/g;
      return escaped.replace(urlRegex, (url) => {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline break-all">${url}</a>`;
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // ============================================================
    // 初期化: スレッド一覧のリスナー開始
    // ============================================================
    initThreadsListener();

    // ページ離脱時にリスナー解除
    window.addEventListener('beforeunload', () => {
      if (postsUnsubscribe) postsUnsubscribe();
      if (threadsUnsubscribe) threadsUnsubscribe();
    });

    // エラーハンドリング
    window.addEventListener('unhandledrejection', (event) => {
      console.error('未処理のPromiseエラー:', event.reason);
    });
  </script>

  <!-- ============================================================
       ★ Firebase セキュリティルール（コンソールで設定してください）★
  ============================================================

  【Firestore ルール】
  rules_version = '2';
  service cloud.firestore {
    match /databases/{database}/documents {
      match /threads/{threadId} {
        allow read: if true;
        allow create: if request.resource.data.title is string
                      && request.resource.data.title.size() > 0
                      && request.resource.data.title.size() <= 100
                      && request.resource.data.postCount is number;
        allow update: if request.resource.data.postCount is number
                      && request.resource.data.postCount >= 0;
        allow delete: if false;

        match /posts/{postId} {
          allow read: if true;
          allow create: if request.resource.data.content is string
                        && request.resource.data.content.size() > 0
                        && request.resource.data.content.size() <= 2000
                        && request.resource.data.author is string;
          allow update, delete: if false;
        }
      }
    }
  }

  【Storage ルール】
  rules_version = '2';
  service firebase.storage {
    match /b/{bucket}/o {
      match /uploads/{fileName} {
        allow read: if true;
        allow write: if request.resource.size < 10 * 1024 * 1024
                     && (request.resource.contentType.matches('image/.*')
                      || request.resource.contentType.matches('video/.*')
                      || request.resource.contentType == 'application/pdf'
                      || request.resource.contentType == 'text/plain');
      }
    }
  }
  ============================================================ -->
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匿名掲示板 (2ch風)</title>
  <!-- デザイン用のTailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDK (v10 modular/compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 max-w-4xl mx-auto">

  <!-- ヘッダー -->
  <header class="border-b-2 border-red-800 pb-2 mb-4">
    <h1 class="text-3xl font-bold text-red-900">2ch風 匿名掲示板</h1>
    <p class="text-sm text-gray-600">画像・動画・ファイル・自動URLリンク対応</p>
  </header>

  <!-- 投稿フォーム -->
  <section class="bg-amber-50 border border-amber-200 p-4 rounded mb-6 shadow-sm">
    <h2 class="text-lg font-bold text-gray-700 mb-2">新規書き込み</h2>
    <form id="postForm" class="space-y-3">
      
      <!-- 本文入力欄 -->
      <div>
        <textarea id="content" rows="4" placeholder="コメントを入力してください（必須）。URLを入れると自動でリンクになります。" class="w-full border p-2 rounded text-sm focus:outline-none focus:ring-2 focus:ring-red-800" required></textarea>
      </div>

      <!-- ファイル添付と送信ボタン -->
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div>
          <label class="block text-xs text-gray-600 mb-1">添付ファイル (画像/動画/その他):</label>
          <input type="file" id="fileInput" class="text-xs text-gray-600">
        </div>
        <button type="submit" id="submitBtn" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-6 rounded text-sm transition">
          書き込む
        </button>
      </div>
    </form>
  </section>

  <!-- 投稿一覧表示エリア -->
  <main>
    <h2 class="text-xl font-bold border-b pb-1 mb-4 text-gray-700">スレッド一覧</h2>
    <div id="postsContainer" class="space-y-4">
      <p class="text-gray-500 text-sm">読み込み中...</p>
    </div>
  </main>

  <!-- JavaScript (Firebase連携ロジック) -->
  <script>
    // 1. Firebaseの設定（提供された情報をそのまま埋め込んでいます）
    const firebaseConfig = {
      apiKey: "AIzaSyBCoiJAnVWIOH9csEPlDyWJgfj6sSlNO2o",
      authDomain: "chaneler-52b95.firebaseapp.com",
      projectId: "chaneler-52b95",
      storageBucket: "chaneler-52b95.firebasestorage.app",
      messagingSenderId: "538510918184",
      appId: "1:538510918184:web:58232aa80922ff00b92b1d",
      measurementId: "G-QF3LDMNQYQ"
    };

    // Firebaseの初期化
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    // DOM要素の取得
    const postForm = document.getElementById('postForm');
    const postsContainer = document.getElementById('postsContainer');
    const submitBtn = document.getElementById('submitBtn');

    // 2. 投稿処理
    postForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const content = document.getElementById('content').value.trim();
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!content) return;

      // 連投防止のためにボタンを無効化
      submitBtn.disabled = true;
      submitBtn.innerText = '送信中...';

      try {
        let fileData = null;

        // ファイルが選択されている場合、Firebase Storageにアップロード
        if (file) {
          const storageRef = storage.ref(`uploads/${Date.now()}_${file.name}`);
          const snapshot = await storageRef.put(file);
          const downloadURL = await snapshot.ref.getDownloadURL();
          
          fileData = {
            url: downloadURL,
            name: file.name,
            type: file.type
          };
        }

        // Firestoreに投稿データを保存（名前は「名無しさん」固定）
        await db.collection('posts').add({
          author: '名無しさん',
          content: content,
          file: fileData,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // フォームのリセット
        postForm.reset();
      } catch (error) {
        console.error("投稿エラー:", error);
        alert("投稿に失敗しました。Cloud FirestoreやStorageのセキュリティルール（書き込み許可）を確認してください。");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '書き込む';
      }
    });

    // 3. リアルタイム投稿取得と画面表示
    db.collection('posts').orderBy('createdAt', 'asc').onSnapshot((snapshot) => {
      postsContainer.innerHTML = ''; 

      if (snapshot.empty) {
        postsContainer.innerHTML = '<p class="text-gray-500 text-sm">投稿がまだありません。</p>';
        return;
      }

      let index = 1;
      snapshot.forEach((doc) => {
        const post = doc.data();
        const date = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString('ja-JP') : '送信中...';

        // 投稿表示用の枠組み作成
        const postDiv = document.createElement('div');
        postDiv.className = 'bg-white p-3 border border-gray-300 rounded text-sm shadow-sm';

        // ヘッダー部（番号・「名無しさん」・日時）と本文
        let html = `
          <div class="font-bold text-gray-700 mb-1">
            <span class="text-red-800">${index}</span> ：
            <span class="text-green-700">名無しさん</span>：
            <span class="text-gray-500 text-xs font-normal">${date}</span>
          </div>
          <div class="text-gray-900 whitespace-pre-wrap mb-2">${formatContent(post.content)}</div>
        `;

        // 添付ファイルの描画（画像・動画・その他ファイル）
        if (post.file) {
          const file = post.file;
          html += `<div class="mt-2 p-2 border border-gray-200 bg-gray-50 rounded">`;
          
          if (file.type.startsWith('image/')) {
            // 画像
            html += `<a href="${file.url}" target="_blank"><img src="${file.url}" class="max-h-64 rounded object-contain mb-1" alt="添付画像"></a>`;
          } else if (file.type.startsWith('video/')) {
            // 動画
            html += `<video controls class="max-h-64 rounded w-full max-w-md mb-1"><source src="${file.url}" type="${file.type}">動画を再生できません。</video>`;
          }
          
          // ダウンロードリンク
          html += `
            <a href="${file.url}" target="_blank" download class="text-xs text-blue-600 underline flex items-center gap-1">
              📎 添付ファイル: ${escapeHtml(file.name)}
            </a>
          </div>`;
        }

        postDiv.innerHTML = html;
        postsContainer.appendChild(postDiv);
        index++;
      });
    });

    // HTMLエスケープ＆URLの自動リンク化処理
    function formatContent(str) {
      if (!str) return '';
      // 1. エスケープ処理（XSS対策）
      let escaped = escapeHtml(str);
      
      // 2. 本文内のURLを検出してクリック可能なリンク（<a>タグ）に自動置換
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return escaped.replace(urlRegex, (url) => {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline break-all">${url}</a>`;
      });
    }

    // XSS対策のエスケープ関数
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>

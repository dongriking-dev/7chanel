    function formatContent(str) {
      if (!str) return '';

    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');

    function fileToBase64Image(file) {
      return new Promise((resolve, reject) => {
        if (!file) { resolve(null); return; }
        if (!file.type.startsWith('image/')) {
          reject(new Error('画像ファイルを選択してください'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました'));
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
          img.onload = () => {
            let { width, height } = img;
            if (width > IMAGE_MAX_WIDTH) {
              height = Math.round(height * (IMAGE_MAX_WIDTH / width));
              width = IMAGE_MAX_WIDTH;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            let quality = IMAGE_QUALITY;
            let dataUrl = canvas.toDataURL('image/jpeg', quality);
            while (dataUrl.length > IMAGE_MAX_BASE64_SIZE && quality > 0.3) {
              quality -= 0.1;
              dataUrl = canvas.toDataURL('image/jpeg', quality);
            }
            if (dataUrl.length > IMAGE_MAX_BASE64_SIZE) {
              reject(new Error('画像が大きすぎます。別の画像を選んでください。'));
              return;
            }
            resolve({
              dataUrl: dataUrl,
              name: file.name,
              type: 'image/jpeg',
              width: width,
              height: height,
              size: dataUrl.length
            });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function buildFileHtml(file) {
      if (!file || !file.dataUrl) return '';
      const name = file.name || '添付画像';
      const dataUrl = file.dataUrl;
      return `
        <div class="post-file">
          <a href="${dataUrl}" target="_blank" rel="noopener noreferrer">
            <img src="${dataUrl}" alt="${escapeHtml(name)}" loading="lazy">
          </a>
          <a href="${dataUrl}" download="${escapeHtml(name)}">📎 ${escapeHtml(name)}（${formatSize(file.size)}）</a>
        </div>`;
    }
    function formatSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    }

    async function updatePreview(fileInput, boxId, imgId, infoId) {
      const file = fileInput.files[0];
      const box = document.getElementById(boxId);
      const img = document.getElementById(imgId);
      const info = document.getElementById(infoId);
      if (!file) {
        box.classList.remove('show');
        img.src = '';
        info.textContent = '';
        return null;
      }
      try {
        const result = await fileToBase64Image(file);
        img.src = result.dataUrl;
        info.textContent = `${file.name}（${result.width}×${result.height}, ${formatSize(result.size)}）`;
        box.classList.add('show');
        return result;
      } catch (err) {
        alert(err.message);
        fileInput.value = '';
        box.classList.remove('show');
        return null;
      }
    }

    // 1. スレッド作成

    // 2. スレッド一覧
    function initThreadsListener() {
      if (threadsUnsubscribe) threadsUnsubscribe();

      const threadsRef = ref(db, 'threads');
      const q = query(threadsRef, orderByChild('createdAt'));

      threadsUnsubscribe = onValue(q, (snapshot) => {
        setConnection(true);
        threadsContainer.innerHTML = '';

        if (!snapshot.exists()) {
          threadsContainer.innerHTML = '<p class="text-gray-500 text-sm">スレッドがありません。新しく作成してください。</p>';
          return;
        }

        const threads = [];
        snapshot.forEach((child) => {
          threads.push({ key: child.key, ...child.val() });
        });
        threads.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        threads.forEach((thread) => {
          let date = '日時不明';
          if (thread.createdAt) {
            try { date = new Date(thread.createdAt).toLocaleString('ja-JP'); }
            catch (e) { date = '日時不明'; }
          }

          const item = document.createElement('div');
          item.className = 'bg-white p-3 border border-gray-300 rounded hover:bg-amber-50 cursor-pointer transition flex justify-between items-center shadow-sm';
          item.onclick = () => openThread(thread.key, thread.title, date, thread.authorEmail, thread.authorUid);
          item.innerHTML = `
            <div class="flex-1 min-w-0">
              <span class="font-bold text-blue-900 break-words">${escapeHtml(thread.title)}</span>
              <span class="text-xs text-gray-400 ml-2 whitespace-nowrap">(${date})</span>
            </div>
            <span class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded-full ml-2 whitespace-nowrap">開く</span>`;
          threadsContainer.appendChild(item);
        });
      }, (error) => {
        console.error("スレッド一覧の取得エラー:", error);
        setConnection(false);
        threadsContainer.innerHTML =
          '<p class="text-red-500 text-sm">スレッド一覧の読み込みに失敗しました。<br>' +
          'Realtime Database のルールを確認してください。</p>';
        showBanner('読み込み失敗: ' + (error.code || error.message), true);
      });
    }

    // 3. レス読み込み
    function loadPosts(threadKey) {
      if (postsUnsubscribe) { postsUnsubscribe(); postsUnsubscribe = null; }
      postsContainer.innerHTML = '<p class="text-gray-500 text-sm"><span class="loading-spinner"></span> 読み込み中...</p>';

      const postsRef = ref(db, `threads/${threadKey}/posts`);
      const q = query(postsRef, orderByChild('createdAt'));

      postsUnsubscribe = onValue(q, (snapshot) => {
        setConnection(true);
        postsContainer.innerHTML = '';

        if (!snapshot.exists()) {
          allPostsCache = [];
          postNumberMap = new Map();
          postsContainer.innerHTML = '<p class="text-gray-500 text-sm">まだ書き込みがありません。</p>';
          return;
        }

        const posts = [];
        snapshot.forEach((child) => {
          posts.push({ key: child.key, ...child.val() });
        });
        posts.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        allPostsCache = posts;

        postNumberMap = new Map();
        posts.forEach((p, i) => postNumberMap.set(p.key, i + 1));

        const childrenMap = new Map();
        const rootPosts = [];
        const keySet = new Set(posts.map(p => p.key));

        posts.forEach((p) => {
          let pid = p.parentId || null;
          if (pid && !keySet.has(pid)) pid = null;
          if (pid === null) {
            rootPosts.push(p);
          } else {
            if (!childrenMap.has(pid)) childrenMap.set(pid, []);
            childrenMap.get(pid).push(p);
          }
        });

        const frag = document.createDocumentFragment();
        rootPosts.forEach((p) => frag.appendChild(renderPostTree(p, childrenMap)));
        postsContainer.appendChild(frag);

        if (activeReplyParentId && keySet.has(activeReplyParentId)) {
          openReplyBox(activeReplyParentId);
        } else {
          activeReplyParentId = null;
        }
      }, (error) => {
        console.error("レス読み込みエラー:", error);
        setConnection(false);
        postsContainer.innerHTML = '<p class="text-red-500 text-sm">レス一覧の読み込みに失敗しました。</p>';
        showBanner('レス読み込み失敗: ' + (error.code || error.message), true);
      });
    }

    // ★ 投稿のロールバッジ（全員に見える）
    function buildPostRoleBadge(post) {
      if (!post) return '';
      if (post.badgeVisible === false) return '';   // バッジ非公開
      const role = post.authorRole;
      if (role === 'admin') return `<span class="role-post-badge admin">管理者</span>`;
      if (role === 'owner') return `<span class="role-post-badge owner">主</span>`;
      if (role === 'vip')   return `<span class="role-post-badge vip">VIP</span>`;
      return '';
    }

    function renderPostTree(post, childrenMap) {
      const wrap = document.createElement('div');
      wrap.className = 'post-tree';
      wrap.dataset.postKey = post.key;

      const number = postNumberMap.get(post.key) || '?';
      let date = '送信中...';
      if (post.createdAt) {
        try { date = new Date(post.createdAt).toLocaleString('ja-JP'); }
        catch (e) { date = '日時不明'; }
      }

      let opBadge = '';
      if (currentThreadOwnerUid && post.authorUid === currentThreadOwnerUid) {
        opBadge = `<span class="op-badge">スレ主</span>`;
      }

      // ★ 投稿に付くロールバッジ（管理者・主・VIP、全員に見える）
      const roleBadgeHtml = buildPostRoleBadge(post);

      let adminInfo = '';
      if (canDelete()) {
        adminInfo = `<span class="admin-email">${escapeHtml(post.authorEmail || 'メール不明')}</span>`;
      }

      let replyLabel = '';
      if (post.parentId && postNumberMap.has(post.parentId)) {
        const parentNum = postNumberMap.get(post.parentId);
        replyLabel = `<span class="reply-target-label">↩ >>${parentNum}</span>`;
      }

      const fileHtml = post.file ? buildFileHtml(post.file) : '';

      const postDiv = document.createElement('div');
      postDiv.className = 'post-card';
      postDiv.innerHTML = `
        <div class="font-bold text-gray-700 mb-1 flex flex-wrap items-baseline gap-x-1 items-center">
          <span class="post-number">${number}</span>
          <span>：</span>
          <span class="post-author">${escapeHtml(post.author || '名無しさん')}</span>
          ${opBadge}
          ${roleBadgeHtml}
          <span>：</span>
          <span class="text-gray-500 text-xs font-normal">${date}</span>
          ${adminInfo}
          <span class="ml-auto flex gap-1">
            <button class="reply-btn" data-reply-key="${post.key}">返信</button>
            ${canDelete() ? `<button class="delete-btn" data-post-key="${post.key}">削除</button>` : ''}
          </span>
        </div>
        ${post.content ? `<div class="text-gray-900 whitespace-pre-wrap mb-1 break-words">${formatContent(post.content)}</div>` : ''}
        ${fileHtml}
        ${replyLabel ? `<div class="mt-1">${replyLabel}</div>` : ''}
      `;

      const rbtn = postDiv.querySelector('.reply-btn');
      if (rbtn) rbtn.addEventListener('click', () => onReplyClick(post.key));
      if (canDelete()) {
        const dbtn = postDiv.querySelector('.delete-btn');
        if (dbtn) dbtn.addEventListener('click', () => deletePost(currentThreadKey, post.key, postNumberMap.get(post.key)));
      }

      wrap.appendChild(postDiv);

      const children = childrenMap.get(post.key) || [];
      if (children.length > 0) {
        const childWrap = document.createElement('div');
        childWrap.className = 'post-children';
        children.forEach((c) => childWrap.appendChild(renderPostTree(c, childrenMap)));
        wrap.appendChild(childWrap);
      }

      return wrap;
    }

    function onReplyClick(parentId) {
      if (!currentUser) { alert('ログインが必要です。'); return; }
      if (activeReplyParentId === parentId) { closeReplyBox(); return; }
      activeReplyParentId = parentId;
      openReplyBox(parentId);
    }

    function openReplyBox(parentId) {
      document.querySelectorAll('.inline-reply-box').forEach(el => el.remove());

      const targetWrap = postsContainer.querySelector(`.post-tree[data-post-key="${parentId}"]`);
      if (!targetWrap) return;
      const targetCard = targetWrap.querySelector('.post-card');
      if (!targetCard) return;

      const parentNum = postNumberMap.get(parentId) || '?';

      const box = document.createElement('div');
      box.className = 'inline-reply-box';
      box.innerHTML = `
        <div class="reply-target-label">>>${parentNum} への返信</div>
        <textarea class="reply-textarea" placeholder="返信を入力（最大2000文字）" maxlength="2000"></textarea>
        <div class="mt-2">
          <label class="block text-xs text-gray-600 mb-1">画像を添付（任意）:</label>
          <input type="file" class="reply-file text-xs text-gray-600 w-full" accept="image/*">
          <div class="preview-box reply-preview">
            <img class="reply-preview-img" alt="プレビュー">
            <div class="preview-info reply-preview-info"></div>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-2">
          <button class="reply-cancel-btn">キャンセル</button>
          <button class="reply-send-btn bg-red-800 hover:bg-red-900 text-white text-xs py-1.5 px-4 rounded">返信する</button>
        </div>
      `;

      targetCard.insertAdjacentElement('afterend', box);

      const ta = box.querySelector('.reply-textarea');
      const fileInp = box.querySelector('.reply-file');
      const cancelBtn = box.querySelector('.reply-cancel-btn');
      const sendBtn = box.querySelector('.reply-send-btn');
      const previewBox = box.querySelector('.reply-preview');
      const previewImg = box.querySelector('.reply-preview-img');
      const previewInfo = box.querySelector('.reply-preview-info');

      fileInp.addEventListener('change', async () => {
        const f = fileInp.files[0];
        if (!f) { previewBox.classList.remove('show'); return; }
        try {
          const result = await fileToBase64Image(f);
          previewImg.src = result.dataUrl;
          previewInfo.textContent = `${f.name}（${result.width}×${result.height}, ${formatSize(result.size)}）`;
          previewBox.classList.add('show');
        } catch (err) {
          alert(err.message);
          fileInp.value = '';
          previewBox.classList.remove('show');
        }
      });

      cancelBtn.addEventListener('click', () => {
        activeReplyParentId = null;
        box.remove();
      });

      sendBtn.addEventListener('click', async () => {
        const content = ta.value.trim();
        const file = fileInp.files[0];
        if (!content && !file) { alert('返信内容または画像を指定してください。'); return; }
        sendBtn.disabled = true;
        sendBtn.textContent = file ? '画像処理中...' : '送信中...';
        try {
          await submitReply(parentId, content, file);
          activeReplyParentId = null;
          box.remove();
        } catch (err) {
          console.error(err);
          sendBtn.disabled = false;
          sendBtn.textContent = '返信する';
        }
      });

      ta.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') sendBtn.click();
      });

      ta.focus();
    }

    function closeReplyBox() {
      activeReplyParentId = null;
      document.querySelectorAll('.inline-reply-box').forEach(el => el.remove());
    }

    async function submitReply(parentId, content, file) {
      if (!currentUser) throw new Error('ログインが必要です');
      if (!currentThreadKey) throw new Error('スレッドが選択されていません');

      let fileData = null;
      if (file) fileData = await fileToBase64Image(file);

      const postsRef = ref(db, `threads/${currentThreadKey}/posts`);
      const newPostRef = push(postsRef);
      await set(newPostRef, {
        author: '名無しさん',
        content: content || '',
        createdAt: Date.now(),
        authorEmail: currentUser.email,
        authorUid: currentUser.uid,
        authorRole: userRole || null,     // ★
        badgeVisible: myBadgePublic,      // ★
        parentId: parentId,
        file: fileData
      });
      showBanner('返信を保存しました', false);
    }

    // 4. レス投稿
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) { alert('ログインが必要です。'); return; }
      if (!currentThreadKey) { alert('スレッドが選択されていません。'); return; }

      const content = document.getElementById('postContent').value.trim();
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      const submitBtn = document.getElementById('submitBtn');

      if (!content && !file) { alert('コメントまたは画像を指定してください。'); return; }

      const originalText = submitBtn.innerText;
      submitBtn.disabled = true;
      submitBtn.innerText = file ? '画像処理中...' : '送信中...';

      const tempId = 'optimistic_post_' + Date.now();
      const tempPost = document.createElement('div');
      tempPost.id = tempId;
      tempPost.className = 'post-card optimistic-post';
      const optimisticIndex = allPostsCache.length + 1;
      let opBadge = '';
      if (currentThreadOwnerUid && currentUser.uid === currentThreadOwnerUid) {
        opBadge = `<span class="op-badge">スレ主</span>`;
      }
      // 楽観的表示にもロールバッジを出す
      let optimisticRoleBadge = '';
      if (myBadgePublic) {
        if (userRole === 'admin') optimisticRoleBadge = `<span class="role-post-badge admin">管理者</span>`;
        else if (userRole === 'owner') optimisticRoleBadge = `<span class="role-post-badge owner">主</span>`;
        else if (userRole === 'vip') optimisticRoleBadge = `<span class="role-post-badge vip">VIP</span>`;
      }
      tempPost.innerHTML = `
        <div class="font-bold text-gray-700 mb-1 flex flex-wrap items-baseline gap-x-1">
          <span class="post-number">${optimisticIndex}</span>
          <span>：</span>
          <span class="post-author">名無しさん</span>
          ${opBadge}
          ${optimisticRoleBadge}
          <span>：</span>
          <span class="text-gray-500 text-xs font-normal">送信中...</span>
        </div>
        ${content ? `<div class="text-gray-900 whitespace-pre-wrap mb-2 break-words">${formatContent(content)}</div>` : ''}
        ${file ? `<div class="text-xs text-gray-400 mt-1">📎 ${escapeHtml(file.name)}（処理中...）</div>` : ''}`;
      postsContainer.appendChild(tempPost);
      tempPost.scrollIntoView({ behavior: 'smooth', block: 'end' });

      try {
        let fileData = null;
        if (file) fileData = await fileToBase64Image(file);

        document.getElementById('postForm').reset();
        document.getElementById('postPreviewBox').classList.remove('show');

        const postsRef = ref(db, `threads/${currentThreadKey}/posts`);
        const newPostRef = push(postsRef);
        await set(newPostRef, {
          author: '名無しさん',
          content: content || '',
          createdAt: Date.now(),
          authorEmail: currentUser.email,
          authorUid: currentUser.uid,
          authorRole: userRole || null,     // ★
          badgeVisible: myBadgePublic,      // ★
          parentId: null,
          file: fileData
        });

        showBanner('書き込みを保存しました', false);
        const el = document.getElementById(tempId);
        if (el) el.remove();
      } catch (error) {
        console.error("投稿エラー:", error);
        const el = document.getElementById(tempId);
        if (el) el.remove();
        showBanner('保存失敗: ' + (error.code || error.message || ''), true);
        alert(`書き込みに失敗しました: ${error.message || '不明なエラー'}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
      }
    });

    // 5. 削除
    window.deletePost = async function(threadKey, postKey, index) {
      if (!canDelete()) { alert('削除権限がありません。'); return; }

      const hasChildren = allPostsCache.some(p => p.parentId === postKey);
      const msg = hasChildren
        ? `レス #${index} を削除しますか？\n※ このレスへの返信もすべて削除されます。\nこの操作は取り消せません。`
        : `レス #${index} を削除しますか？\nこの操作は取り消せません。`;
      if (!confirm(msg)) return;

      try {
        const toDelete = collectDescendants(postKey);
        toDelete.push(postKey);
        for (const key of toDelete) {
          await remove(ref(db, `threads/${threadKey}/posts/${key}`));
        }
        showBanner('レスを削除しました', false);
      } catch (err) {
        console.error("削除エラー:", err);
        showBanner('削除失敗: ' + (err.code || err.message), true);
        alert('削除に失敗しました。');
      }
    };

    function collectDescendants(parentKey) {
      const result = [];
      const stack = [parentKey];
      while (stack.length) {
        const cur = stack.pop();
        allPostsCache.forEach(p => {
          if (p.parentId === cur) {
            result.push(p.key);
            stack.push(p.key);
          }
        });
      }
      return result;
    }

    window.deleteCurrentThread = async function() {
      if (!canDelete()) { alert('削除権限がありません。'); return; }
      if (!currentThreadKey) return;
      if (!confirm('このスレッドをすべてのレスごと削除しますか？\nこの操作は取り消せません。')) return;

      const key = currentThreadKey;
      try {
        await remove(ref(db, `threads/${key}`));
        showBanner('スレッドを削除しました', false);
        showThreadList();
      } catch (err) {
        console.error("スレッド削除エラー:", err);
        showBanner('削除失敗: ' + (err.code || err.message), true);
        alert('削除に失敗しました。');
      }
    };

    // 6. バックアップ / 復元
    window.doBackup = async function() {
      if (!canBackup()) { alert('バックアップ権限がありません。'); return; }
      try {
        showBanner('バックアップを作成中...', false);
        const snap = await get(ref(db, 'threads'));
        const data = snap.exists() ? snap.val() : {};
        const payload = {
          _meta: {
            exportedAt: new Date().toISOString(),
            exportedBy: currentUser.email,
            app: '69ch'
          },
          threads: data
        };
        const json = JSON.stringify(payload, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        a.href = url;
        a.download = `69ch-backup-${ts}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showBanner('バックアップをダウンロードしました', false);
      } catch (err) {
        console.error("バックアップエラー:", err);
        showBanner('バックアップ失敗: ' + (err.code || err.message), true);
        alert('バックアップに失敗しました。');
      }
    };

    document.getElementById('restoreInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      if (!canBackup()) { alert('復元権限がありません。'); return; }

      if (!confirm(
        '【警告】\n' +
        '選択したバックアップファイルで、現在のすべてのスレッドを上書きします。\n' +
        '現在のデータは完全に失われます（バックアップを取っていない場合）。\n\n' +
        '本当に復元しますか？'
      )) return;

      const doubleCheck = prompt('確認のため「RESTORE」と入力してください（大文字・半角）:');
      if (doubleCheck !== 'RESTORE') {
        alert('キャンセルしました。');
        return;
      }

      try {
        showBanner('復元中...', false);
        const text = await file.text();
        const parsed = JSON.parse(text);

        let threadsData;
        if (parsed && typeof parsed === 'object' && parsed.threads && typeof parsed.threads === 'object') {
          threadsData = parsed.threads;
        } else if (parsed && typeof parsed === 'object') {
          threadsData = parsed;
        } else {
          throw new Error('不正なバックアップファイル形式です');
        }

        await set(ref(db, 'threads'), threadsData);

        showBanner('復元が完了しました', false);
        alert('復元が完了しました。');
        showThreadList();
      } catch (err) {
        console.error("復元エラー:", err);
        showBanner('復元失敗: ' + (err.code || err.message), true);
        alert('復元に失敗しました。\n' + (err.message || ''));
      }
    });

    window.addEventListener('beforeunload', () => {
      if (postsUnsubscribe) postsUnsubscribe();
      if (threadsUnsubscribe) threadsUnsubscribe();
    });
    window.addEventListener('unhandledrejection', (event) => {
      console.error('未処理のPromiseエラー:', event.reason);
    });
  </script>
</body>
</html>

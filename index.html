<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7ch</title>
  <!-- TailWind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 max-w-4xl mx-auto">

  <!-- ヘッダー -->
  <header class="border-b-2 border-red-800 pb-2 mb-4 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold text-red-900 cursor-pointer" onclick="showThreadList()">7ちゃんねる</h1>
      <p class="text-sm text-gray-600">全データ クラウド永続保存対応</p>
    </div>
    <button id="backToListBtn" onclick="showThreadList()" class="hidden bg-gray-600 hover:bg-gray-700 text-white text-xs py-1.5 px-3 rounded">
      ← スレッド一覧に戻る
    </button>
  </header>

  <!-- ================= View 1: スレッド一覧画面 ================= -->
  <div id="threadListView">
    <!-- 新規スレッド作成フォーム -->
    <section class="bg-amber-50 border border-amber-200 p-4 rounded mb-6 shadow-sm">
      <h2 class="text-lg font-bold text-gray-700 mb-2">新規スレッド作成</h2>
      <form id="createThreadForm" class="space-y-3">
        <input type="text" id="threadTitle" placeholder="スレッドのタイトルを入力（必須）" class="w-full border p-2 rounded text-sm" required>
        <textarea id="firstPostContent" rows="3" placeholder="最初の書き込み内容（任意）" class="w-full border p-2 rounded text-sm"></textarea>
        <button type="submit" id="createThreadBtn" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-6 rounded text-sm transition">
          スレッドを立てる
        </button>
      </form>
    </section>

    <!-- スレッド一覧 -->
    <main>
      <h2 class="text-xl font-bold border-b pb-1 mb-4 text-gray-700">スレッド一覧</h2>
      <div id="threadsContainer" class="space-y-2">
        <p class="text-gray-500 text-sm">スレッドを読み込み中...</p>
      </div>
    </main>
  </div>

  <!-- ================= View 2: スレッド詳細（書き込み）画面 ================= -->
  <div id="threadDetailView" class="hidden">
    <div class="bg-white p-4 border border-gray-300 rounded mb-4 shadow-sm">
      <h2 id="currentThreadTitle" class="text-2xl font-bold text-red-900 mb-1"></h2>
      <p id="currentThreadDate" class="text-xs text-gray-500"></p>
    </div>

    <!-- 返信投稿フォーム -->
    <section class="bg-amber-50 border border-amber-200 p-4 rounded mb-6 shadow-sm">
      <h3 class="text-md font-bold text-gray-700 mb-2">このスレッドに書き込む</h3>
      <form id="postForm" class="space-y-3">
        <textarea id="postContent" rows="4" placeholder="コメントを入力してください。URLは自動でリンク化されます。" class="w-full border p-2 rounded text-sm" required></textarea>
        <div class="flex items-center justify-between flex-wrap gap-2">
          <div>
            <label class="block text-xs text-gray-600 mb-1">添付ファイル (画像/動画/その他):</label>
            <input type="file" id="fileInput" class="text-xs text-gray-600">
          </div>
          <button type="submit" id="submitBtn" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-6 rounded text-sm transition">
            書き込む
          </button>
        </div>
      </form>
    </section>

    <!-- レス一覧 -->
    <main>
      <h3 class="text-lg font-bold border-b pb-1 mb-4 text-gray-700">レス一覧</h3>
      <div id="postsContainer" class="space-y-4">
        <p class="text-gray-500 text-sm">読み込み中...</p>
      </div>
    </main>
  </div>

  <!-- JavaScript ロジック -->
  <script>
    // 1. Firebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyBCoiJAnVWIOH9csEPlDyWJgfj6sSlNO2o",
      authDomain: "chaneler-52b95.firebaseapp.com",
      projectId: "chaneler-52b95",
      storageBucket: "chaneler-52b95.firebasestorage.app",
      messagingSenderId: "538510918184",
      appId: "1:538510918184:web:58232aa80922ff00b92b1d",
      measurementId: "G-QF3LDMNQYQ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentThreadId = null;
    let postsUnsubscribe = null;

    // DOM Elements
    const threadListView = document.getElementById('threadListView');
    const threadDetailView = document.getElementById('threadDetailView');
    const backToListBtn = document.getElementById('backToListBtn');
    const threadsContainer = document.getElementById('threadsContainer');
    const postsContainer = document.getElementById('postsContainer');

    // 画面切り替え: スレッド一覧を表示
    function showThreadList() {
      threadListView.classList.remove('hidden');
      threadDetailView.classList.add('hidden');
      backToListBtn.classList.add('hidden');
      currentThreadId = null;
      if (postsUnsubscribe) postsUnsubscribe(); // リアルタイム監視解除
    }

    // 画面切り替え: スレッド詳細を表示
    function openThread(threadId, title, createdAt) {
      currentThreadId = threadId;
      document.getElementById('currentThreadTitle').innerText = title;
      document.getElementById('currentThreadDate').innerText = '作成日時: ' + createdAt;

      threadListView.classList.add('hidden');
      threadDetailView.classList.remove('hidden');
      backToListBtn.classList.remove('hidden');

      loadPosts(threadId);
    }

    // 2. スレッド作成処理
    document.getElementById('createThreadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('threadTitle').value.trim();
      const content = document.getElementById('firstPostContent').value.trim();
      const btn = document.getElementById('createThreadBtn');

      if (!title) return;

      btn.disabled = true;
      btn.innerText = '作成中...';

      try {
        // スレッドドキュメントを作成
        const threadRef = await db.collection('threads').add({
          title: title,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          postCount: content ? 1 : 0
        });

        // 最初の書き込みがあれば追加
        if (content) {
          await db.collection('threads').doc(threadRef.id).collection('posts').add({
            author: '名無しさん',
            content: content,
            file: null,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        document.getElementById('createThreadForm').reset();
      } catch (err) {
        console.error("スレッド作成エラー:", err);
        alert("スレッドの作成に失敗しました。");
      } finally {
        btn.disabled = false;
        btn.innerText = 'スレッドを立てる';
      }
    });

    // 3. スレッド一覧のリアルタイム読み込み
    db.collection('threads').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
      threadsContainer.innerHTML = '';

      if (snapshot.empty) {
        threadsContainer.innerHTML = '<p class="text-gray-500 text-sm">スレッドがありません。新しく作成してください。</p>';
        return;
      }

      snapshot.forEach((doc) => {
        const thread = doc.data();
        const date = thread.createdAt ? new Date(thread.createdAt.toDate()).toLocaleString('ja-JP') : '作成中...';

        const item = document.createElement('div');
        item.className = 'bg-white p-3 border border-gray-300 rounded hover:bg-amber-50 cursor-pointer transition flex justify-between items-center';
        item.onclick = () => openThread(doc.id, thread.title, date);

        item.innerHTML = `
          <div>
            <span class="font-bold text-blue-900">${escapeHtml(thread.title)}</span>
            <span class="text-xs text-gray-400 ml-2">(${date})</span>
          </div>
          <span class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded-full">開く</span>
        `;
        threadsContainer.appendChild(item);
      });
    });

    // 4. 特定スレッド内の書き込み（レス）読み込み
    function loadPosts(threadId) {
      postsContainer.innerHTML = '<p class="text-gray-500 text-sm">読み込み中...</p>';

      if (postsUnsubscribe) postsUnsubscribe();

      postsUnsubscribe = db.collection('threads').doc(threadId).collection('posts')
        .orderBy('createdAt', 'asc')
        .onSnapshot((snapshot) => {
          postsContainer.innerHTML = '';

          if (snapshot.empty) {
            postsContainer.innerHTML = '<p class="text-gray-500 text-sm">まだ書き込みがありません。</p>';
            return;
          }

          let index = 1;
          snapshot.forEach((doc) => {
            const post = doc.data();
            const date = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString('ja-JP') : '送信中...';

            const postDiv = document.createElement('div');
            postDiv.className = 'bg-white p-3 border border-gray-300 rounded text-sm shadow-sm';

            let html = `
              <div class="font-bold text-gray-700 mb-1">
                <span class="text-red-800">${index}</span> ：
                <span class="text-green-700">名無しさん</span>：
                <span class="text-gray-500 text-xs font-normal">${date}</span>
              </div>
              <div class="text-gray-900 whitespace-pre-wrap mb-2">${formatContent(post.content)}</div>
            `;

            if (post.file) {
              const file = post.file;
              html += `<div class="mt-2 p-2 border border-gray-200 bg-gray-50 rounded">`;
              if (file.type.startsWith('image/')) {
                html += `<a href="${file.url}" target="_blank"><img src="${file.url}" class="max-h-64 rounded object-contain mb-1"></a>`;
              } else if (file.type.startsWith('video/')) {
                html += `<video controls class="max-h-64 rounded w-full max-w-md mb-1"><source src="${file.url}" type="${file.type}"></video>`;
              }
              html += `<a href="${file.url}" target="_blank" download class="text-xs text-blue-600 underline">📎 ${escapeHtml(file.name)}</a></div>`;
            }

            postDiv.innerHTML = html;
            postsContainer.appendChild(postDiv);
            index++;
          });
        });
    }

    // 5. 返信（レス）書き込み処理
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentThreadId) return;

      const content = document.getElementById('postContent').value.trim();
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      const submitBtn = document.getElementById('submitBtn');

      if (!content) return;

      submitBtn.disabled = true;
      submitBtn.innerText = '送信中...';

      try {
        let fileData = null;
        if (file) {
          const storageRef = storage.ref(`uploads/${Date.now()}_${file.name}`);
          const snapshot = await storageRef.put(file);
          const downloadURL = await snapshot.ref.getDownloadURL();
          fileData = { url: downloadURL, name: file.name, type: file.type };
        }

        await db.collection('threads').doc(currentThreadId).collection('posts').add({
          author: '名無しさん',
          content: content,
          file: fileData,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('postForm').reset();
      } catch (error) {
        console.error("投稿エラー:", error);
        alert("書き込みに失敗しました。");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '書き込む';
      }
    });

    // ユーティリティ: XSS対策 & URLリンク化
    function formatContent(str) {
      if (!str) return '';
      let escaped = escapeHtml(str);
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return escaped.replace(urlRegex, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline break-all">${url}</a>`);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
